<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure of Lemon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #87CEEB;
        }

        #menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('menu_bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        #menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
        }
        #menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 215, 0, 0.08);
            backdrop-filter: blur(20px);
            padding: 50px 70px;
            border-radius: 60px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(255, 215, 0, 0.05);
            text-align: center;
            animation: menuPulse 4s ease-in-out infinite;
        }
        @keyframes menuPulse {
            0%, 100% { box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(255, 215, 0, 0.05); }
            50% { box-shadow: 0 40px 100px rgba(255, 215, 0, 0.3), inset 0 0 100px rgba(255, 215, 0, 0.1); }
        }
        .menu-card h1 {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 60px #fdd83544;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-weight: 900;
        }
        .menu-card p {
            color: #f0f0f0;
            font-size: 1.2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .play-btn-wrapper {
            display: flex;
            justify-content: center;
        }
        .play-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: btnGlow 2.5s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.9)); }
        }
        .play-btn:hover {
            transform: scale(1.15);
        }
        .play-btn:active {
            transform: scale(0.9);
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            background: #87CEEB;
            overflow: hidden;
        }

        /* --- FALLING LEAVES PARTICLES --- */
        .leaf-particle {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
        }

        .tree-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90vmin;
            height: 100vmin;
            pointer-events: none;
            z-index: 1;
        }
        .tree-shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 10%;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent);
            border-radius: 50%;
        }
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12%;
            height: 50%;
            background: linear-gradient(90deg, #4a2c11, #8b5a2b, #3d200b);
            border-radius: 40% 40% 0 0;
            box-shadow: inset -10px 0 15px rgba(0,0,0,0.6);
        }
        .branch {
            position: absolute;
            background: #5d3a1a;
            border-radius: 40%;
            box-shadow: inset -5px 0 8px rgba(0,0,0,0.4);
        }
        .branch-1 { width: 30%; height: 5%; top: 35%; left: -20%; transform: rotate(-40deg); border-radius: 20px; }
        .branch-2 { width: 35%; height: 5%; top: 25%; right: -25%; transform: rotate(45deg); border-radius: 20px; }
        .branch-3 { width: 25%; height: 4%; top: 15%; left: -10%; transform: rotate(-25deg); }
        .branch-4 { width: 28%; height: 4%; top: 8%; right: -15%; transform: rotate(30deg); }
        .branch-5 { width: 20%; height: 4%; top: 0%; left: 5%; transform: rotate(-15deg); }

        .canopy {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 90%;
            border-radius: 60% 40% 50% 50%;
            background: radial-gradient(circle at 30% 30%, #66bb6a, #388e3c, #1b5e20);
            box-shadow: inset -40px -40px 80px rgba(0,0,0,0.7), 0 40px 60px rgba(0,0,0,0.5);
            overflow: visible;
            z-index: 1;
        }
        .leaf-cluster {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #81c784, #2e7d32);
            opacity: 0.8;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3);
        }
        .leaf-cluster:nth-child(1) { width: 40%; height: 40%; top: 15%; left: -15%; }
        .leaf-cluster:nth-child(2) { width: 45%; height: 45%; top: -5%; right: -20%; }
        .leaf-cluster:nth-child(3) { width: 35%; height: 35%; bottom: 15%; left: 25%; }
        .leaf-cluster:nth-child(4) { width: 30%; height: 30%; bottom: 10%; right: 15%; }
        .leaf-cluster:nth-child(5) { width: 20%; height: 20%; top: 40%; left: 5%; }

        .lemon-fruit {
            position: absolute;
            font-size: 4vmin;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
            transition: transform 0.2s ease, filter 0.2s;
            z-index: 2;
            animation: lemonGlow 2s ease-in-out infinite alternate;
        }
        @keyframes lemonGlow {
            0% { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)) brightness(1); }
            100% { filter: drop-shadow(0 6px 20px rgba(255, 215, 0, 0.8)) brightness(1.1); }
        }
        .lemon-fruit:hover {
            transform: scale(1.4) rotate(20deg);
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            padding: 14px 28px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .ui-panel h2 {
            color: #fff;
            font-size: 1.6rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }
        .ui-panel .score {
            color: #fdd835;
            font-weight: bold;
            font-size: 1.5rem;
            background: rgba(0,0,0,0.5);
            padding: 6px 24px;
            border-radius: 40px;
            border: 1px solid #fdd83555;
        }
        .shop-btn {
            background: linear-gradient(135deg, #ffd700, #ff4500);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 69, 0, 0.6);
            transition: transform 0.15s, box-shadow 0.2s;
            z-index: 6;
        }
        .shop-btn:hover { transform: scale(1.08); box-shadow: 0 6px 30px rgba(255, 69, 0, 0.8); }
        .shop-btn:active { transform: scale(0.95); }

        #shopModal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 200;
        }
        #shopModal.active { display: flex; }
        .shop-content {
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(12px);
            padding: 50px 60px; border-radius: 50px;
            border: 2px solid #fdd835; box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            text-align: center; min-width: 320px;
        }
        .shop-content h2 { color: #fdd835; font-size: 2.5rem; margin-bottom: 25px; }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.08); padding: 20px 25px;
            border-radius: 25px; margin: 15px 0;
        }
        .shop-item span { color: #fff; font-size: 1.3rem; }
        .shop-item .cost { color: #ffd700; font-weight: bold; }
        .shop-item button {
            background: linear-gradient(135deg, #ffd700, #ff4500);
            border: none; border-radius: 25px; padding: 10px 24px;
            color: white; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        .shop-item button:disabled { opacity: 0.5; cursor: not-allowed; }
        .shop-item button:hover:not(:disabled) { transform: scale(1.05); }
        .close-shop {
            margin-top: 25px; background: rgba(255,255,255,0.15);
            border: none; border-radius: 40px; padding: 12px 35px;
            color: white; font-size: 1.1rem; cursor: pointer; transition: background 0.2s;
        }
        .close-shop:hover { background: rgba(255,255,255,0.25); }

        #player {
            position: absolute;
            width: clamp(65px, 12vmin, 140px);
            height: auto;
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 15px 25px rgba(255, 215, 0, 0.7));
            border-radius: 30%;
            object-fit: contain;
            transition: none;
        }
        #fallbackEmoji {
            display: none;
            position: absolute;
            font-size: clamp(65px, 12vmin, 140px);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 15px 25px rgba(255, 215, 0, 0.7));
        }

        @keyframes idleFloat {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(-2deg); }
            50% { transform: translate(-50%, -50%) translateY(-12px) rotate(2deg); }
            100% { transform: translate(-50%, -50%) translateY(0px) rotate(-2deg); }
        }
        .idle {
            animation: idleFloat 2.5s ease-in-out infinite;
        }

        @keyframes lemonBounce {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            20% { transform: translate(-50%, -50%) scale(1.25) rotate(15deg) translateY(-10px); }
            40% { transform: translate(-50%, -50%) scale(0.85) rotate(-5deg) translateY(8px); }
            60% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg) translateY(-5px); }
            80% { transform: translate(-50%, -50%) scale(0.95) rotate(-3deg) translateY(3px); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg) translateY(0px); }
        }
        .bounce {
            animation: lemonBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .joystick {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 75px 75px 75px; grid-template-rows: 75px 75px 75px; gap: 6px;
            z-index: 20; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px);
            padding: 14px; border-radius: 60px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .joystick button {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px; font-size: 2.5rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.1s, transform 0.05s;
            touch-action: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); outline: none;
        }
        .joystick button:active, .joystick button.active {
            background: rgba(255, 215, 0, 0.6); border-color: #fdd835;
            transform: scale(0.85); box-shadow: 0 0 40px #fdd83566;
        }
        .joystick .empty { visibility: hidden; }
        .joystick .up { grid-column: 2; grid-row: 1; }
        .joystick .left { grid-column: 1; grid-row: 2; }
        .joystick .right { grid-column: 3; grid-row: 2; }
        .joystick .down { grid-column: 2; grid-row: 3; }

        @media (max-width: 600px) {
            .menu-card { padding: 30px 30px; }
            .menu-card h1 { font-size: 2.8rem; }
            .joystick { grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; padding: 10px; gap: 4px; }
            .joystick button { font-size: 2rem; }
            .ui-panel h2 { font-size: 1rem; }
            .ui-panel .score { font-size: 1rem; padding: 2px 14px; }
            .shop-btn { padding: 8px 16px; font-size: 0.9rem; }
            #player, #fallbackEmoji { font-size: clamp(50px, 15vmin, 90px); }
        }
    </style>
</head>
<body>

    <div id="menu">
        <div class="menu-card">
            <h1>🍋 Adventure of Lemon</h1>
            <p>Explore the grove. Collect lemons to earn points. Unlock the sword!</p>
            <div class="play-btn-wrapper">
                <button class="play-btn" onclick="startGame()">
                    <svg viewBox="0 0 140 90" width="220" height="140">
                        <defs>
                            <linearGradient id="lemonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFF59D" />
                                <stop offset="40%" stop-color="#FDD835" />
                                <stop offset="100%" stop-color="#F9A825" />
                            </linearGradient>
                            <filter id="lemonShadow">
                                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
                            </filter>
                        </defs>
                        <ellipse cx="70" cy="45" rx="60" ry="38" fill="url(#lemonGrad)" stroke="#C17900" stroke-width="4" filter="url(#lemonShadow)"/>
                        <path d="M 70 7 L 63 -5 L 77 -5 Z" fill="#66BB6A" stroke="#388E3C" stroke-width="2"/>
                        <path d="M 70 83 L 63 95 L 77 95 Z" fill="#66BB6A" stroke="#388E3C" stroke-width="2"/>
                        <ellipse cx="50" cy="35" rx="18" ry="10" fill="#FFFFFF" opacity="0.3"/>
                        <text x="70" y="56" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="900" font-family="Arial, sans-serif" stroke="#6d4c00" stroke-width="2">Play</text>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="game">
        <div class="tree-container">
            <div class="tree-shadow"></div>
            <div class="trunk"></div>
            <div class="branch branch-1"></div>
            <div class="branch branch-2"></div>
            <div class="branch branch-3"></div>
            <div class="branch branch-4"></div>
            <div class="branch branch-5"></div>
            <div class="canopy" id="canopy">
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
            </div>
        </div>

        <div class="ui-panel">
            <h2>🍋 Adventure</h2>
            <span class="score" id="scoreDisplay">🍋 0</span>
            <button class="shop-btn" id="shopBtn">🛒 Shop</button>
        </div>

        <img id="player" src="smile_lemon.png" alt="Smile Lemon">
        <div id="fallbackEmoji">🍋</div>

        <div class="joystick">
            <button class="up" data-dir="up">⬆</button>
            <button class="left" data-dir="left">⬅</button>
            <button class="empty"></button>
            <button class="right" data-dir="right">➡</button>
            <button class="down" data-dir="down">⬇</button>
        </div>
    </div>

    <div id="shopModal">
        <div class="shop-content">
            <h2>🍋 Lemon Shop</h2>
            <div class="shop-item">
                <span>⚔️ Sword of Zest</span>
                <span class="cost">150 🍋</span>
                <button id="buySwordBtn" onclick="buySword()">Buy</button>
            </div>
            <button class="close-shop" onclick="closeShop()">Close</button>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const playerImg = document.getElementById('player');
        const fallbackEmoji = document.getElementById('fallbackEmoji');
        const scoreSpan = document.getElementById('scoreDisplay');
        const canopy = document.getElementById('canopy');
        const shopModal = document.getElementById('shopModal');
        const shopBtn = document.getElementById('shopBtn');
        const buySwordBtn = document.getElementById('buySwordBtn');

        let playerElement = playerImg;
        playerImg.onerror = () => {
            playerImg.style.display = 'none';
            fallbackEmoji.style.display = 'block';
            playerElement = fallbackEmoji;
            playerElement.classList.add('idle');
        };
        playerImg.onload = () => {
            playerImg.style.display = 'block';
            fallbackEmoji.style.display = 'none';
            playerElement = playerImg;
            playerElement.classList.add('idle');
        };

        let x = 0, y = 0, score = 0, moveInterval = null;
        const STEP = 18;
        let lemonFruits = [];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, duration, type = 'sine', volume = 0.3) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCollectSound() {
            playTone(523, 0.1, 'sine', 0.2);
            setTimeout(() => playTone(659, 0.1, 'sine', 0.2), 80);
            setTimeout(() => playTone(784, 0.15, 'sine', 0.2), 160);
        }

        function playBuySound() {
            playTone(440, 0.15, 'triangle', 0.3);
            setTimeout(() => playTone(554, 0.15, 'triangle', 0.3), 150);
            setTimeout(() => playTone(659, 0.2, 'triangle', 0.3), 300);
        }

        let bgMusicInterval = null;
        function startBgMusic() {
            if (bgMusicInterval) return;
            initAudio();
            const notes = [523, 587, 659, 784, 659, 587, 523, 659];
            let idx = 0;
            bgMusicInterval = setInterval(() => {
                playTone(notes[idx % notes.length], 0.3, 'sine', 0.05);
                idx++;
            }, 400);
        }

        function stopBgMusic() {
            if (bgMusicInterval) {
                clearInterval(bgMusicInterval);
                bgMusicInterval = null;
            }
        }

        function startGame() {
            initAudio();
            startBgMusic();
            menu.classList.add('hidden');
            setTimeout(() => { menu.style.display = 'none'; }, 800);
            game.style.display = 'block';
            centerPlayer();
            spawnLemons(20);
            score = 0;
            updateScore();
            if (localStorage.getItem('swordOwned') === 'true') {
                buySwordBtn.disabled = true;
                buySwordBtn.textContent = '⚔️ Owned';
            }
            // Create falling leaves
            createLeafParticles();
        }

        function centerPlayer() {
            x = window.innerWidth / 2;
            y = window.innerHeight / 2;
            updatePosition(false);
            playerElement.classList.remove('bounce');
            playerElement.classList.add('idle');
        }

        function updatePosition(bounce = true) {
            playerElement.style.left = x + 'px';
            playerElement.style.top = y + 'px';
            if (bounce) {
                playerElement.classList.remove('idle');
                playerElement.classList.add('bounce');
                setTimeout(() => {
                    playerElement.classList.remove('bounce');
                    playerElement.classList.add('idle');
                }, 350);
            }
        }

        function move(dx, dy) {
            const newX = Math.min(Math.max(x + dx, 10), window.innerWidth - 10);
            const newY = Math.min(Math.max(y + dy, 10), window.innerHeight - 10);
            if (newX !== x || newY !== y) {
                x = newX;
                y = newY;
                updatePosition(true);
                checkLemonCollection();
                return true;
            }
            return false;
        }

        function updateScore() {
            scoreSpan.textContent = '🍋 ' + score;
            if (score >= 150 && !localStorage.getItem('swordOwned')) {
                buySwordBtn.disabled = false;
            } else {
                buySwordBtn.disabled = true;
            }
        }

        function spawnLemons(count) {
            lemonFruits.forEach(f => f.remove());
            lemonFruits = [];
            for (let i = 0; i < count; i++) createLemon();
        }

        function createLemon() {
            const lemon = document.createElement('div');
            lemon.className = 'lemon-fruit';
            lemon.textContent = '🍋';
            const left = 5 + Math.random() * 90;
            const top = 5 + Math.random() * 90;
            lemon.style.left = left + '%';
            lemon.style.top = top + '%';
            lemon.style.fontSize = (3 + Math.random() * 2) + 'vmin';
            lemon.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
            canopy.appendChild(lemon);
            lemonFruits.push(lemon);
            return lemon;
        }

        function checkLemonCollection() {
            const pRect = playerElement.getBoundingClientRect();
            const pCenterX = pRect.left + pRect.width / 2;
            const pCenterY = pRect.top + pRect.height / 2;
            for (let i = lemonFruits.length - 1; i >= 0; i--) {
                const lemon = lemonFruits[i];
                const lRect = lemon.getBoundingClientRect();
                const lCenterX = lRect.left + lRect.width / 2;
                const lCenterY = lRect.top + lRect.height / 2;
                const dist = Math.hypot(pCenterX - lCenterX, pCenterY - lCenterY);
                if (dist < 70) {
                    lemon.remove();
                    lemonFruits.splice(i, 1);
                    score += 5;
                    updateScore();
                    playCollectSound();
                    createLemon();
                    break;
                }
            }
        }

        function moveUp() { move(0, -STEP); }
        function moveDown() { move(0, STEP); }
        function moveLeft() { move(-STEP, 0); }
        function moveRight() { move(STEP, 0); }

        document.addEventListener('keydown', (e) => {
            if (!e.key.startsWith('Arrow')) return;
            e.preventDefault();
            switch (e.key) {
                case 'ArrowUp': moveUp(); break;
                case 'ArrowDown': moveDown(); break;
                case 'ArrowLeft': moveLeft(); break;
                case 'ArrowRight': moveRight(); break;
            }
        });

        const buttons = document.querySelectorAll('.joystick button:not(.empty)');
        buttons.forEach(btn => {
            const dir = btn.dataset.dir;
            const startMove = (e) => {
                e.preventDefault();
                btn.classList.add('active');
                switch (dir) {
                    case 'up': moveUp(); break;
                    case 'down': moveDown(); break;
                    case 'left': moveLeft(); break;
                    case 'right': moveRight(); break;
                }
                if (moveInterval) clearInterval(moveInterval);
                moveInterval = setInterval(() => {
                    switch (dir) {
                        case 'up': moveUp(); break;
                        case 'down': moveDown(); break;
                        case 'left': moveLeft(); break;
                        case 'right': moveRight(); break;
                    }
                }, 70);
            };
            const stopMove = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                if (moveInterval) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
            };
            btn.addEventListener('mousedown', startMove);
            btn.addEventListener('mouseup', stopMove);
            btn.addEventListener('mouseleave', stopMove);
            btn.addEventListener('touchstart', startMove, { passive: false });
            btn.addEventListener('touchend', stopMove, { passive: false });
            btn.addEventListener('touchcancel', stopMove, { passive: false });
        });

        window.addEventListener('resize', () => {
            const maxX = window.innerWidth - 10;
            const maxY = window.innerHeight - 10;
            if (x > maxX) x = maxX;
            if (y > maxY) y = maxY;
            updatePosition(false);
        });

        function createLeafParticles() {
            const leaves = ['🍃', '🌿', '🍂'];
            for (let i = 0; i < 15; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf-particle';
                leaf.textContent = leaves[i % leaves.length];
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
                leaf.style.animationDuration = (8 + Math.random() * 12) + 's';
                leaf.style.animationDelay = (Math.random() * 10) + 's';
                game.appendChild(leaf);
            }
        }

        shopBtn.addEventListener('click', () => shopModal.classList.add('active'));
        function closeShop() { shopModal.classList.remove('active'); }
        shopModal.addEventListener('click', (e) => { if (e.target === shopModal) closeShop(); });

        function buySword() {
            if (score >= 150 && !localStorage.getItem('swordOwned')) {
                score -= 150;
                updateScore();
                localStorage.setItem('swordOwned', 'true');
                buySwordBtn.disabled = true;
                buySwordBtn.textContent = '⚔️ Owned';
                playBuySound();
                closeShop();
            }
        }

        menu.style.display = 'flex';
        game.style.display = 'none';
        window.addEventListener('load', () => { spawnLemons(20); });
    </script>
</body>
</html>
