<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure of Lemon - Shield Parry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Arial Black', sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #6DC6E4;
        }
        .clouds {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 40px -20px 0 20px rgba(255, 255, 255, 0.9), 80px 0 0 0 rgba(255, 255, 255, 0.9), -40px 0 0 0 rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.1));
            animation: drift linear infinite;
        }
        .cloud:nth-child(1) { width: 120px; height: 50px; top: 12%; animation-duration: 35s; }
        .cloud:nth-child(2) { width: 90px; height: 40px; top: 25%; animation-duration: 28s; }
        .cloud:nth-child(3) { width: 150px; height: 60px; top: 8%; animation-duration: 40s; }
        .cloud:nth-child(4) { width: 100px; height: 45px; top: 30%; animation-duration: 32s; }
        @keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(110vw); } }

        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('menu_bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        #menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        #menu.hidden { opacity: 0; pointer-events: none; }
        .menu-card {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, #FFFDE7, #FFF59D);
            padding: 40px 60px;
            border-radius: 40px;
            border: 8px solid #FDD835;
            box-shadow: 0 20px 0 #B8860B, 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 90vw;
            animation: wobbleCard 3s ease-in-out infinite;
        }
        @keyframes wobbleCard { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
        .menu-card h1 {
            font-size: 3.5rem;
            color: #222;
            text-shadow: 4px 4px 0 #FDD835;
            margin-bottom: 10px;
        }
        .menu-card p { color: #333; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; }
        .play-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .play-btn:active { transform: scale(0.9); }
        .play-btn svg { width: 180px; height: 120px; transition: transform 0.2s; }
        .play-btn:hover svg { transform: scale(1.1) rotate(-3deg); }

        #game {
            position: fixed;
            inset: 0;
            display: none;
            background: #6DC6E4;
            overflow: hidden;
        }

        .tree-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(65vmin, 550px);
            height: min(85vmin, 700px);
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
        }
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16%;
            height: 45%;
            background: linear-gradient(90deg, #6b4226, #8B5A2B, #6b4226);
            border-radius: 20px 20px 0 0;
            border: 4px solid #5D3A1A;
        }
        .canopy {
            position: absolute;
            top: -25%;
            left: 50%;
            transform: translateX(-50%);
            width: 160%;
            height: 85%;
            border-radius: 60% 40% 50% 50%;
            background: radial-gradient(circle at 30% 30%, #66bb6a, #2E8B57);
            border: 6px solid #1E5A3A;
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.3);
            overflow: visible;
        }
        .leaf-cluster {
            position: absolute;
            border-radius: 50%;
            background: #3CB371;
            border: 4px solid #2E8B57;
        }
        .leaf-cluster:nth-child(1) { width: 40%; height: 40%; top: 5%; left: -15%; }
        .leaf-cluster:nth-child(2) { width: 50%; height: 50%; top: -10%; right: -20%; }
        .leaf-cluster:nth-child(3) { width: 35%; height: 35%; bottom: 10%; left: 20%; }
        .leaf-cluster:nth-child(4) { width: 30%; height: 30%; bottom: 5%; right: 15%; }
        .leaf-cluster:nth-child(5) { width: 25%; height: 25%; top: 30%; left: 5%; }

        .lemon-fruit {
            position: absolute;
            font-size: 3.5vmin;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: transform 0.1s;
            z-index: 2;
            animation: glowPulse 1.5s infinite alternate;
        }
        @keyframes glowPulse { 0% { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); } 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); } }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 4px solid #222;
            box-shadow: 0 8px 0 #111;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ui-panel .title { font-size: 1.4rem; font-weight: 900; color: #333; }
        .ui-panel .score { font-size: 1.2rem; font-weight: 900; color: #FDD835; background: #222; padding: 2px 15px; border-radius: 8px; }
        .ui-panel .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-roblox {
            border: none;
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 900;
            color: #FFF;
            cursor: pointer;
            box-shadow: 0 6px 0 #1E3A8A;
            transition: transform 0.05s, box-shadow 0.05s;
            border: 3px solid #222;
        }
        .btn-roblox:active { transform: translateY(4px); box-shadow: 0 2px 0 #1E3A8A; }
        .btn-roblox.adventure { background: #4169E1; box-shadow: 0 6px 0 #1E3A8A; }
        .btn-roblox.shop { background: #FF4500; box-shadow: 0 6px 0 #B22222; }

        #player-wrapper {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: clamp(60px, 10vmin, 120px);
            height: auto;
        }
        #player-wrapper img {
            width: 100%; height: auto; display: block;
            filter: drop-shadow(0 10px 20px rgba(255,215,0,0.4));
            animation: idleFloat 2.2s ease-in-out infinite;
        }
        #player-wrapper.bounce img { animation: none; animation: lemonBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #player-wrapper .weapon-holder {
            position: absolute;
            display: none;
            z-index: 11;
            width: 80%;
            height: 80%;
            right: -45%;
            top: -15%;
            transform: rotate(-15deg);
        }
        #player-wrapper .weapon-holder.active { display: block; }
        @keyframes idleFloat {
            0% { transform: rotate(-3deg) scale(1); }
            30% { transform: rotate(3deg) scale(1.04) translateY(-4px); }
            60% { transform: rotate(-2deg) scale(0.96) translateY(2px); }
            100% { transform: rotate(-3deg) scale(1); }
        }
        @keyframes lemonBounce {
            0% { transform: scale(1) rotate(0); }
            25% { transform: scale(1.3) rotate(12deg) translateY(-15px); }
            50% { transform: scale(0.8) rotate(-6deg) translateY(8px); }
            75% { transform: scale(1.1) rotate(4deg) translateY(-6px); }
            100% { transform: scale(1) rotate(0) translateY(0); }
        }

        .joystick {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 5px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 30px;
            border: 5px solid #222;
            box-shadow: 0 10px 0 #111;
        }
        .joystick button {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: 900;
            color: #222;
            cursor: pointer;
            box-shadow: 0 6px 0 #888;
            transition: transform 0.05s, box-shadow 0.05s;
            touch-action: none;
            outline: none;
            border: 3px solid #222;
        }
        .joystick button:active, .joystick button.active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #888;
            background: #FDD835;
        }
        .joystick .empty { visibility: hidden; } .joystick .up { grid-column: 2; grid-row: 1; } .joystick .left { grid-column: 1; grid-row: 2; } .joystick .right { grid-column: 3; grid-row: 2; } .joystick .down { grid-column: 2; grid-row: 3; }

        #adventureOverlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #3CB371;
            border: 10px solid #222;
            overflow: hidden;
        }
        #adventureOverlay.active { display: flex; }
        .close-adventure {
            position: absolute; top: 15px; right: 15px;
            background: #FF0000; border: 4px solid #222;
            border-radius: 10px; padding: 5px 15px;
            font-weight: 900; color: #FFF; cursor: pointer; z-index: 40;
        }
        .battle-arena {
            width: 90%; max-width: 600px; height: 70%;
            background: #8FBC8F; border-radius: 20px;
            border: 8px solid #222; position: relative;
            box-shadow: inset 0 -30px 0 #556B2F;
        }
        /* Enemy HP */
        .enemy-hp-container {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            width: 80%; background: #222; border-radius: 20px; padding: 4px; border: 3px solid #000;
        }
        .enemy-hp-bar { height: 20px; width: 100%; background: #FF0000; border-radius: 15px; transition: width 0.2s; }
        .enemy-hp-text {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #FFF; font-weight: 900; font-size: 0.9rem;
        }
        /* Player HP Bar (Orange-Yellow-Red Gradient) */
        .player-hp-container {
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 30%;
            background: #222;
            border-radius: 20px;
            padding: 4px;
            border: 3px solid #000;
            z-index: 15;
        }
        .player-hp-bar {
            height: 20px;
            width: 100%;
            background: linear-gradient(90deg, #FF4500, #FFA500, #FFD700);
            border-radius: 15px;
            transition: width 0.3s;
        }
        .player-hp-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            font-weight: 900;
            font-size: 0.8rem;
        }
        .worm {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .worm .worm-eyes { position: absolute; top: -10px; display: flex; gap: 20px; }
        .worm .worm-eyes span { width: 20px; height: 20px; background: #FFF; border-radius: 50%; border: 3px solid #222; }
        .worm .worm-segment {
            width: 60px; height: 35px; background: #8B4513;
            border-radius: 30px; border: 4px solid #5C2E0B;
        }
        .battle-player {
            position: absolute; bottom: 10%; left: 20%;
            width: clamp(60px, 10vmin, 100px); height: auto; z-index: 10;
        }
        .battle-player img { width: 100%; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .battle-player .weapon-holder {
            width: 80%; height: 100%; right: -50%; top: -10%; transform: rotate(-15deg);
        }
        /* Shield SVG */
        .shield-svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
        }
        /* Parry Button */
        .parry-btn {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            background: #FFD700; border: 6px solid #222;
            border-radius: 20px; padding: 10px 30px;
            font-size: 1.5rem; font-weight: 900; color: #222;
            box-shadow: 0 10px 0 #B8860B; cursor: pointer;
        }
        .parry-btn:active { transform: translateX(-50%) translateY(6px); box-shadow: 0 4px 0 #B8860B; }
        .parry-btn:disabled { opacity: 0.5; transform: translateX(-50%) translateY(6px); pointer-events: none; }
        /* Spike Projectile */
        .spike {
            position: absolute;
            width: 20px; height: 20px;
            background: #888;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            pointer-events: none;
            z-index: 12;
        }
        /* Parry Flash */
        .parry-flash {
            position: absolute;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,215,0,0.5) 50%, transparent 70%);
            pointer-events: none;
            z-index: 13;
            animation: flashOut 0.2s forwards;
        }
        @keyframes flashOut {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        #shopModal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); z-index: 200;
            justify-content: center; align-items: center;
        }
        #shopModal.active { display: flex; }
        .shop-content {
            background: #FFF; padding: 30px; border-radius: 20px;
            border: 8px solid #222; text-align: center; min-width: 280px;
        }
        .shop-content h2 { color: #333; font-weight: 900; }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #EEE; padding: 15px; border-radius: 10px;
            margin: 20px 0; border: 4px solid #222;
        }
        .shop-item span { font-size: 1.1rem; font-weight: 900; }
        .shop-item .cost { color: #FDD835; }
        .shop-item button {
            background: #FDD835; border: none; border-radius: 8px;
            padding: 8px 16px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 0 #B8860B;
        }
        .shop-item button:disabled { opacity: 0.5; transform: translateY(4px); box-shadow: none; pointer-events: none; }

        @media (max-width: 800px) { .tree-container { width: 80vmin; height: 90vmin; } }
        @media (max-width: 600px) {
            .menu-card { padding: 30px 20px; } .menu-card h1 { font-size: 2.5rem; } .play-btn svg { width: 120px; height: 80px; }
            .joystick { grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 4px; padding: 6px; }
            .joystick button { font-size: 1.6rem; } .ui-panel .title { font-size: 1rem; }
            .ui-panel .btn-group .btn-roblox { padding: 4px 10px; font-size: 0.8rem; }
            .parry-btn { font-size: 1.2rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>
    <!-- MAIN MENU -->
    <div id="menu">
        <div class="menu-card">
            <h1>🍋 ADVENTURE OF LEMON</h1>
            <p>Collect lemons. Buy the Shield. Parry spikes!</p>
            <button class="play-btn" onclick="startGame()">
                <svg viewBox="0 0 140 90">
                    <rect x="10" y="10" width="120" height="70" rx="20" fill="#FDD835" stroke="#C17900" stroke-width="6"/>
                    <text x="70" y="60" text-anchor="middle" fill="#222" font-size="36" font-weight="900" stroke="#000" stroke-width="2">PLAY</text>
                </svg>
            </button>
        </div>
    </div>

    <!-- GAME WORLD -->
    <div id="game" onclick="resumeAudio()">
        <div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
        <div class="tree-container"><div class="trunk"></div><div class="canopy" id="canopy"><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div></div></div>

        <div class="ui-panel">
            <div class="title">LEMON QUEST</div>
            <span class="score" id="scoreDisplay">🍋 0</span>
            <div class="btn-group">
                <button class="btn-roblox adventure" id="adventureBtn">⚔️ ADVENTURES</button>
                <button class="btn-roblox shop" id="shopBtn">🛒 SHOP</button>
            </div>
        </div>

        <div id="player-wrapper">
            <img id="player" alt="Lemon Character">
            <div class="weapon-holder" id="weaponHolder">
                <!-- Shield SVG -->
                <svg class="shield-svg" viewBox="0 0 80 80">
                    <circle cx="40" cy="45" r="35" fill="#C0C0C0" stroke="#888" stroke-width="4"/>
                    <path d="M 40 10 L 55 25 L 55 55 L 40 70 L 25 55 L 25 25 Z" fill="#FFD700" stroke="#B8860B" stroke-width="3"/>
                    <circle cx="40" cy="40" r="8" fill="#FFA500" stroke="#B8860B" stroke-width="2"/>
                    <line x1="40" y1="10" x2="40" y2="70" stroke="#B8860B" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <div class="joystick">
            <button class="up" data-dir="up">▲</button>
            <button class="left" data-dir="left">◄</button>
            <button class="empty"></button>
            <button class="right" data-dir="right">►</button>
            <button class="down" data-dir="down">▼</button>
        </div>

        <div id="adventureOverlay">
            <button class="close-adventure" onclick="closeAdventure()">✕</button>
            <div class="battle-arena" id="battleArena">
                <div class="enemy-hp-container">
                    <div class="enemy-hp-bar" id="wormHPBar"></div>
                    <div class="enemy-hp-text" id="wormHPText">HP: 50 / 50</div>
                </div>
                <!-- Player HP -->
                <div class="player-hp-container" id="playerHPContainer">
                    <div class="player-hp-bar" id="playerHPBar"></div>
                    <div class="player-hp-text" id="playerHPText">HP: 67 / 67</div>
                </div>
                <div class="worm" id="wormContainer">
                    <div class="worm-eyes"><span></span><span></span></div>
                    <div class="worm-segment"></div><div class="worm-segment"></div><div class="worm-segment"></div>
                </div>
                <div class="battle-player" id="battlePlayer">
                    <img id="battleImg" src="">
                    <div class="weapon-holder" id="battleWeaponHolder">
                        <svg class="shield-svg" viewBox="0 0 80 80">
                            <circle cx="40" cy="45" r="35" fill="#C0C0C0" stroke="#888" stroke-width="4"/>
                            <path d="M 40 10 L 55 25 L 55 55 L 40 70 L 25 55 L 25 25 Z" fill="#FFD700" stroke="#B8860B" stroke-width="3"/>
                            <circle cx="40" cy="40" r="8" fill="#FFA500" stroke="#B8860B" stroke-width="2"/>
                            <line x1="40" y1="10" x2="40" y2="70" stroke="#B8860B" stroke-width="2"/>
                        </svg>
                    </div>
                </div>
                <button class="parry-btn" id="parryBtn" onclick="doParry()">🛡️ PARRY</button>
            </div>
        </div>
    </div>

    <!-- SHOP MODAL -->
    <div id="shopModal">
        <div class="shop-content">
            <h2>🍋 LEMON SHOP</h2>
            <div class="shop-item">
                <span>🛡️ SHIELD OF ZEST</span>
                <span class="cost">150 🍋</span>
                <button id="buyWeaponBtn" onclick="buyWeapon()">BUY</button>
            </div>
            <button class="close-shop" onclick="closeShop()">CLOSE</button>
        </div>
    </div>

    <script>
        // ===== AUDIO =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }
        function resumeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(e => {});
            }
        }
        function playTone(f, d, t='sine', v=0.3) {
            if (!audioCtx) return;
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = t; o.frequency.value = f;
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e) {}
        }
        function playCollect() { playTone(523,0.1); setTimeout(()=>playTone(659,0.1),80); }
        function playHit() { playTone(200,0.15,'sawtooth',0.2); playTone(150,0.1,'sawtooth',0.15); }
        function playParry() {
            // Ultrakill parry sound: quick high-pitch clang + noise
            playTone(1200,0.05,'square',0.2);
            setTimeout(()=>playTone(1800,0.05,'square',0.15), 50);
            setTimeout(()=>playTone(1500,0.1,'sine',0.2), 80);
            // Add a noise burst (filtered noise)
            if (audioCtx) {
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i=0; i<bufferSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/bufferSize*5);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.1);
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start();
                source.stop(audioCtx.currentTime+0.1);
            }
        }
        function playBuy() { playTone(440,0.15,'triangle',0.3); setTimeout(()=>playTone(554,0.15,'triangle',0.3),150); }

        // ===== GENERATE LEMON =====
        function generateLemonSprite() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            const gradient = ctx.createRadialGradient(80, 70, 20, 128, 128, 120);
            gradient.addColorStop(0, '#FFF59D');
            gradient.addColorStop(0.3, '#FDD835');
            gradient.addColorStop(0.8, '#F9A825');
            gradient.addColorStop(1, '#C17900');
            ctx.beginPath(); ctx.ellipse(128, 128, 110, 80, 0, 0, Math.PI * 2);
            ctx.fillStyle = gradient; ctx.fill();
            ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(90, 100, 40, 20, -0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(128, 48); ctx.lineTo(116, 20); ctx.lineTo(140, 20); ctx.closePath();
            ctx.fillStyle = '#4CAF50'; ctx.fill();
            ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(95, 100); ctx.lineTo(95, 140); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(161, 100); ctx.lineTo(161, 140); ctx.stroke();
            ctx.beginPath(); ctx.arc(128, 148, 32, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
            ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
            ctx.beginPath(); ctx.ellipse(70, 150, 20, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(186, 150, 20, 10, 0, 0, Math.PI * 2); ctx.fill();
            return c.toDataURL('image/png');
        }

        // ===== GAME ENGINE =====
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const playerWrapper = document.getElementById('player-wrapper');
        const playerImg = document.getElementById('player');
        const battlePlayerImg = document.getElementById('battleImg');
        const scoreSpan = document.getElementById('scoreDisplay');
        const canopy = document.getElementById('canopy');
        const shopModal = document.getElementById('shopModal');
        const shopBtn = document.getElementById('shopBtn');
        const buyWeaponBtn = document.getElementById('buyWeaponBtn');
        const adventureOverlay = document.getElementById('adventureOverlay');
        const adventureBtn = document.getElementById('adventureBtn');
        const parryBtn = document.getElementById('parryBtn');
        const wormHPBar = document.getElementById('wormHPBar');
        const wormHPText = document.getElementById('wormHPText');
        const playerHPBar = document.getElementById('playerHPBar');
        const playerHPText = document.getElementById('playerHPText');
        const weaponHolder = document.getElementById('weaponHolder');
        const battleWeaponHolder = document.getElementById('battleWeaponHolder');

        let x = 0, y = 0, score = 0, moveInterval = null;
        const STEP = 18;
        let lemonFruits = [];
        let weaponOwned = false;
        let wormMaxHP = 50, wormHP = 50;
        let playerMaxHP = 67, playerHP = 67;
        let isParrying = false;
        let spikeActive = false;
        let spikeEl = null;
        let spikeDirection = {dx:0, dy:0};
        let spikeSpeed = 4;
        let spikeDamage = 5;
        let parryCooldown = false;
        let spikeTimer = null;

        function startGame() {
            initAudio();
            const s = generateLemonSprite();
            playerImg.src = s; battlePlayerImg.src = s;
            menu.classList.add('hidden');
            setTimeout(()=>menu.style.display='none',800);
            game.style.display='block';
            setTimeout(()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); },100);
            centerPlayer();
            spawnLemons(20);
            score = 0; updateScore();
            if (localStorage.getItem('weaponOwned')==='true') {
                weaponOwned = true; buyWeaponBtn.disabled = true; buyWeaponBtn.textContent = 'OWNED';
            }
        }

        function centerPlayer() { x = window.innerWidth/2; y = window.innerHeight/2; updatePosition(false); }
        function updatePosition(bounce) {
            playerWrapper.style.left = x + 'px'; playerWrapper.style.top = y + 'px';
            if (bounce) { playerWrapper.classList.add('bounce'); setTimeout(()=>playerWrapper.classList.remove('bounce'),350); }
        }
        function move(dx, dy) {
            const nX = Math.min(Math.max(x+dx,10), window.innerWidth-10);
            const nY = Math.min(Math.max(y+dy,10), window.innerHeight-10);
            if (nX!==x || nY!==y) { x=nX; y=nY; updatePosition(true); checkLemonCollection(); return true; }
            return false;
        }
        function updateScore() {
            scoreSpan.textContent = '🍋 '+score;
            if (score>=150 && !weaponOwned) buyWeaponBtn.disabled = false;
            else buyWeaponBtn.disabled = true;
        }
        function spawnLemons(c) { lemonFruits.forEach(f=>f.remove()); lemonFruits=[]; for(let i=0;i<c;i++) createLemon(); }
        function createLemon() {
            const l = document.createElement('div');
            l.className = 'lemon-fruit'; l.textContent = '🍋';
            l.style.left = (5+Math.random()*90)+'%'; l.style.top = (5+Math.random()*90)+'%';
            l.style.fontSize = (3+Math.random()*2)+'vmin';
            canopy.appendChild(l); lemonFruits.push(l);
        }
        function checkLemonCollection() {
            const r = playerWrapper.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            for (let i=lemonFruits.length-1;i>=0;i--) {
                const l = lemonFruits[i];
                const lr = l.getBoundingClientRect();
                if (Math.hypot(cx-(lr.left+lr.width/2), cy-(lr.top+lr.height/2)) < 70) {
                    l.remove(); lemonFruits.splice(i,1);
                    score += 5; updateScore(); playCollect(); createLemon(); break;
                }
            }
        }
        function moveUp(){move(0,-STEP);} function moveDown(){move(0,STEP);}
        function moveLeft(){move(-STEP,0);} function moveRight(){move(STEP,0);}
        document.addEventListener('keydown', e=>{
            if(!e.key.startsWith('Arrow'))return;
            e.preventDefault();
            switch(e.key){ case'ArrowUp':moveUp();break; case'ArrowDown':moveDown();break; case'ArrowLeft':moveLeft();break; case'ArrowRight':moveRight();break; }
        });
        document.querySelectorAll('.joystick button:not(.empty)').forEach(b=>{
            const d=b.dataset.dir;
            const s=e=>{
                e.preventDefault(); b.classList.add('active');
                switch(d){ case'up':moveUp();break; case'down':moveDown();break; case'left':moveLeft();break; case'right':moveRight();break; }
                if(moveInterval)clearInterval(moveInterval);
                moveInterval=setInterval(()=>{ switch(d){ case'up':moveUp();break; case'down':moveDown();break; case'left':moveLeft();break; case'right':moveRight();break; } },70);
            };
            const st=e=>{ e.preventDefault(); b.classList.remove('active'); if(moveInterval){clearInterval(moveInterval);moveInterval=null;} };
            b.addEventListener('mousedown',s); b.addEventListener('mouseup',st); b.addEventListener('mouseleave',st);
            b.addEventListener('touchstart',s,{passive:false}); b.addEventListener('touchend',st,{passive:false});
        });
        window.addEventListener('resize', ()=>{ const mx=window.innerWidth-10, my=window.innerHeight-10; if(x>mx)x=mx; if(y>my)y=my; updatePosition(false); });

        // Shop
        shopBtn.addEventListener('click', ()=>{ shopModal.classList.add('active'); });
        function closeShop(){ shopModal.classList.remove('active'); }
        function buyWeapon(){
            if(score>=150 && !weaponOwned){
                score-=150; updateScore(); weaponOwned=true;
                localStorage.setItem('weaponOwned','true');
                buyWeaponBtn.disabled=true; buyWeaponBtn.textContent='OWNED';
                playBuy(); closeShop();
            }
        }

        // Adventure mode
        adventureBtn.addEventListener('click', ()=>{
            if(!weaponOwned){ alert('You need to buy the Shield of Zest in the Shop first!'); return; }
            adventureOverlay.classList.add('active');
            wormHP = wormMaxHP; updateWormUI();
            playerHP = playerMaxHP; updatePlayerUI();
            battleWeaponHolder.classList.add('active'); weaponHolder.classList.add('active');
            parryBtn.disabled = false;
            // Start spike shooting
            startSpikeTimer();
        });

        function closeAdventure(){
            adventureOverlay.classList.remove('active');
            battleWeaponHolder.classList.remove('active');
            clearSpikeTimer();
            removeSpike();
        }

        function updateWormUI(){ let p=(wormHP/wormMaxHP)*100; wormHPBar.style.width=p+'%'; wormHPText.textContent='HP: '+wormHP+' / '+wormMaxHP; }
        function updatePlayerUI(){ let p=(playerHP/playerMaxHP)*100; playerHPBar.style.width=p+'%'; playerHPText.textContent='HP: '+playerHP+' / '+playerMaxHP; }

        // Spike system
        function startSpikeTimer(){
            clearSpikeTimer();
            spikeTimer = setInterval(()=>{
                if(!spikeActive && wormHP>0 && playerHP>0){
                    shootSpike();
                }
            }, 2000 + Math.random()*1500); // random 2-3.5s
        }
        function clearSpikeTimer(){ if(spikeTimer){ clearInterval(spikeTimer); spikeTimer=null; } }

        function shootSpike(){
            const arena = document.getElementById('battleArena');
            const wormRect = document.querySelector('.worm').getBoundingClientRect();
            const playerRect = document.querySelector('.battle-player').getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();

            const startX = wormRect.left - arenaRect.left + wormRect.width/2;
            const startY = wormRect.top - arenaRect.top + wormRect.height/2;
            const targetX = playerRect.left - arenaRect.left + playerRect.width/2;
            const targetY = playerRect.top - arenaRect.top + playerRect.height/2;

            const dx = targetX - startX;
            const dy = targetY - startY;
            const length = Math.hypot(dx, dy);
            if(length === 0) return;
            const normDx = dx/length;
            const normDy = dy/length;

            spikeEl = document.createElement('div');
            spikeEl.className = 'spike';
            spikeEl.style.left = startX - 10 + 'px';
            spikeEl.style.top = startY - 10 + 'px';
            arena.appendChild(spikeEl);
            spikeActive = true;
            spikeDirection = {dx: normDx, dy: normDy};

            // Animate spike
            let spikePos = {x: startX, y: startY};
            function animateSpike(){
                if(!spikeActive) return;
                spikePos.x += spikeDirection.dx * spikeSpeed;
                spikePos.y += spikeDirection.dy * spikeSpeed;
                spikeEl.style.left = (spikePos.x - 10) + 'px';
                spikeEl.style.top = (spikePos.y - 10) + 'px';

                // Check if spike hits player
                const playerRect2 = document.querySelector('.battle-player').getBoundingClientRect();
                const arenaRect2 = arena.getBoundingClientRect();
                const pX = playerRect2.left - arenaRect2.left + playerRect2.width/2;
                const pY = playerRect2.top - arenaRect2.top + playerRect2.height/2;
                const dist = Math.hypot(spikePos.x - pX, spikePos.y - pY);
                if(dist < 30){
                    // Hit player!
                    removeSpike();
                    playerHP -= spikeDamage;
                    if(playerHP < 0) playerHP = 0;
                    updatePlayerUI();
                    playHit();
                    if(playerHP <= 0){
                        // Game over? Just reset battle?
                        alert('You died!');
                        closeAdventure();
                    }
                    return;
                }
                // Check if spike leaves arena
                if(spikePos.x < -50 || spikePos.x > arenaRect2.width+50 || spikePos.y < -50 || spikePos.y > arenaRect2.height+50){
                    removeSpike();
                    return;
                }
                requestAnimationFrame(animateSpike);
            }
            requestAnimationFrame(animateSpike);
        }

        function removeSpike(){
            if(spikeEl){
                spikeEl.remove();
                spikeEl = null;
            }
            spikeActive = false;
        }

        // Parry
        function doParry(){
            if(parryCooldown || !spikeActive || wormHP<=0 || playerHP<=0) return;
            // Check if spike is near player
            const arena = document.getElementById('battleArena');
            const playerRect = document.querySelector('.battle-player').getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            const pX = playerRect.left - arenaRect.left + playerRect.width/2;
            const pY = playerRect.top - arenaRect.top + playerRect.height/2;
            if(!spikeEl) return;
            const spikeRect = spikeEl.getBoundingClientRect();
            const sX = spikeRect.left - arenaRect.left + 10;
            const sY = spikeRect.top - arenaRect.top + 10;
            const dist = Math.hypot(sX - pX, sY - pY);
            if(dist < 80){
                // Parry SUCCESS!
                parryCooldown = true;
                setTimeout(()=>parryCooldown=false, 300);
                // Play parry sound
                playParry();
                // Show flash effect
                const flash = document.createElement('div');
                flash.className = 'parry-flash';
                flash.style.left = (pX - 40) + 'px';
                flash.style.top = (pY - 40) + 'px';
                arena.appendChild(flash);
                setTimeout(()=>flash.remove(), 200);

                // Deflect spike: reverse direction and speed up
                spikeDirection.dx = -spikeDirection.dx;
                spikeDirection.dy = -spikeDirection.dy;
                spikeSpeed = 8; // faster
                // Damage worm
                wormHP -= spikeDamage;
                if(wormHP < 0) wormHP = 0;
                updateWormUI();
                if(wormHP <= 0){
                    // Worm killed
                    removeSpike();
                    clearSpikeTimer();
                    setTimeout(()=>{
                        score += 25;
                        updateScore();
                        playCollect();
                        // Reset worm for next round?
                        wormHP = wormMaxHP;
                        updateWormUI();
                        startSpikeTimer();
                    }, 800);
                }
            } else {
                // Parry too early? No effect, but still cooldown to prevent spam
                parryCooldown = true;
                setTimeout(()=>parryCooldown=false, 200);
            }
        }

        // Keyboard parry (Space)
        document.addEventListener('keydown', e=>{
            if(e.key === ' ' || e.key === 'Space'){
                e.preventDefault();
                doParry();
            }
        });

        // Initial state
        menu.style.display='flex'; game.style.display='none';
        window.addEventListener('load', ()=>{ spawnLemons(20); });
    </script>
</body>
</html>
