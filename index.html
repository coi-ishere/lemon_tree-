<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure of Lemon - Parry Shield</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', 'Arial Black', sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #6DC6E4; }

        /* ===== CLOUDS ===== */
        .clouds { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .cloud { position: absolute; background: rgba(255,255,255,0.9); border-radius: 50%; box-shadow: 40px -20px 0 20px rgba(255,255,255,0.9), 80px 0 0 0 rgba(255,255,255,0.9), -40px 0 0 0 rgba(255,255,255,0.9); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); animation: drift linear infinite; }
        .cloud:nth-child(1) { width: 120px; height: 50px; top: 12%; animation-duration: 35s; }
        .cloud:nth-child(2) { width: 90px; height: 40px; top: 25%; animation-duration: 28s; }
        .cloud:nth-child(3) { width: 150px; height: 60px; top: 8%; animation-duration: 40s; }
        .cloud:nth-child(4) { width: 100px; height: 45px; top: 30%; animation-duration: 32s; }
        @keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(110vw); } }

        /* ===== MAIN MENU ===== */
        #menu { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: url('menu_bg.jpg') no-repeat center center; background-size: cover; z-index: 100; transition: opacity 0.8s ease; }
        #menu::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        #menu.hidden { opacity: 0; pointer-events: none; }
        .menu-card { position: relative; z-index: 1; background: linear-gradient(145deg, #FFFDE7, #FFF59D); padding: 40px 60px; border-radius: 40px; border: 8px solid #FDD835; box-shadow: 0 20px 0 #B8860B, 0 30px 60px rgba(0,0,0,0.6); text-align: center; max-width: 90vw; animation: wobbleCard 3s ease-in-out infinite; }
        @keyframes wobbleCard { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
        .menu-card h1 { font-size: 3.5rem; color: #222; text-shadow: 4px 4px 0 #FDD835; margin-bottom: 10px; }
        .menu-card p { color: #333; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; }
        .play-btn { background: transparent; border: none; cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .play-btn:active { transform: scale(0.9); }
        .play-btn svg { width: 180px; height: 120px; transition: transform 0.2s; }
        .play-btn:hover svg { transform: scale(1.1) rotate(-3deg); }

        /* ===== GAME CONTAINER ===== */
        #game { position: fixed; inset: 0; display: none; background: #6DC6E4; overflow: hidden; }

        /* ===== LEMON TREE ===== */
        .tree-container { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(65vmin, 550px); height: min(85vmin, 700px); pointer-events: none; z-index: 1; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3)); }
        .trunk { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 16%; height: 45%; background: linear-gradient(90deg, #6b4226, #8B5A2B, #6b4226); border-radius: 20px 20px 0 0; border: 4px solid #5D3A1A; }
        .canopy { position: absolute; top: -25%; left: 50%; transform: translateX(-50%); width: 160%; height: 85%; border-radius: 60% 40% 50% 50%; background: radial-gradient(circle at 30% 30%, #66bb6a, #2E8B57); border: 6px solid #1E5A3A; box-shadow: inset -20px -20px 40px rgba(0,0,0,0.3); overflow: visible; }
        .leaf-cluster { position: absolute; border-radius: 50%; background: #3CB371; border: 4px solid #2E8B57; }
        .leaf-cluster:nth-child(1) { width: 40%; height: 40%; top: 5%; left: -15%; }
        .leaf-cluster:nth-child(2) { width: 50%; height: 50%; top: -10%; right: -20%; }
        .leaf-cluster:nth-child(3) { width: 35%; height: 35%; bottom: 10%; left: 20%; }
        .leaf-cluster:nth-child(4) { width: 30%; height: 30%; bottom: 5%; right: 15%; }
        .leaf-cluster:nth-child(5) { width: 25%; height: 25%; top: 30%; left: 5%; }
        .lemon-fruit { position: absolute; font-size: 3.5vmin; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); transition: transform 0.1s; z-index: 2; animation: glowPulse 1.5s infinite alternate; }
        @keyframes glowPulse { 0% { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); } 100% { filter: drop-shadow(0 0 15px rgba(255,215,0,0.6)); } }

        /* ===== UI PANEL ===== */
        .ui-panel { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 5; padding: 10px 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 20px; border: 4px solid #222; box-shadow: 0 8px 0 #111; flex-wrap: wrap; gap: 10px; }
        .ui-panel .title { font-size: 1.4rem; font-weight: 900; color: #333; }
        .ui-panel .score { font-size: 1.2rem; font-weight: 900; color: #FDD835; background: #222; padding: 2px 15px; border-radius: 8px; }
        .ui-panel .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-roblox { border: none; border-radius: 10px; padding: 6px 14px; font-size: 0.9rem; font-weight: 900; color: #FFF; cursor: pointer; box-shadow: 0 6px 0 #1E3A8A; transition: transform 0.05s, box-shadow 0.05s; border: 3px solid #222; }
        .btn-roblox:active { transform: translateY(4px); box-shadow: 0 2px 0 #1E3A8A; }
        .btn-roblox.adventure { background: #4169E1; box-shadow: 0 6px 0 #1E3A8A; }
        .btn-roblox.shop { background: #FF4500; box-shadow: 0 6px 0 #B22222; }

        /* ===== PLAYER ===== */
        #player-wrapper { position: absolute; z-index: 10; transform: translate(-50%, -50%); pointer-events: none; width: clamp(60px, 10vmin, 120px); height: auto; }
        #player-wrapper img { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 20px rgba(255,215,0,0.4)); animation: idleFloat 2.2s ease-in-out infinite; }
        #player-wrapper.bounce img { animation: none; animation: lemonBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* ===== SHIELD & SWING ===== */
        #player-wrapper .weapon-holder { position: absolute; display: none; z-index: 11; width: 80%; height: 80%; right: -45%; top: -15%; }
        #player-wrapper .weapon-holder.active { display: block; }
        #player-wrapper .weapon-holder .shield-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); transition: transform 0.15s, filter 0.15s; }

        /* VISIBLE SWING ANIMATION */
        @keyframes parrySwing {
            0% { transform: scale(1) rotate(0deg) translateX(0px); }
            25% { transform: scale(1.3) rotate(60deg) translateX(30px); }
            50% { transform: scale(1.5) rotate(150deg) translateX(-10px); }
            75% { transform: scale(1.2) rotate(250deg) translateX(20px); }
            100% { transform: scale(1) rotate(360deg) translateX(0px); }
        }
        #player-wrapper .weapon-holder.parrying .shield-svg {
            animation: parrySwing 0.35s ease-in-out forwards;
            filter: drop-shadow(0 0 80px #FFF) brightness(1.8) drop-shadow(0 0 30px #FFD700);
        }

        @keyframes idleFloat { 0% { transform: rotate(-3deg) scale(1); } 30% { transform: rotate(3deg) scale(1.04) translateY(-4px); } 60% { transform: rotate(-2deg) scale(0.96) translateY(2px); } 100% { transform: rotate(-3deg) scale(1); } }
        @keyframes lemonBounce { 0% { transform: scale(1) rotate(0); } 25% { transform: scale(1.3) rotate(12deg) translateY(-15px); } 50% { transform: scale(0.8) rotate(-6deg) translateY(8px); } 75% { transform: scale(1.1) rotate(4deg) translateY(-6px); } 100% { transform: scale(1) rotate(0) translateY(0); } }

        /* ===== JOYSTICK ===== */
        .joystick { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 70px 70px 70px; grid-template-rows: 70px 70px 70px; gap: 5px; z-index: 20; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 30px; border: 5px solid #222; box-shadow: 0 10px 0 #111; }
        .joystick button { background: rgba(255,255,255,0.9); border: none; border-radius: 15px; font-size: 2rem; font-weight: 900; color: #222; cursor: pointer; box-shadow: 0 6px 0 #888; transition: transform 0.05s, box-shadow 0.05s; touch-action: none; outline: none; border: 3px solid #222; }
        .joystick button:active, .joystick button.active { transform: translateY(4px); box-shadow: 0 2px 0 #888; background: #FDD835; }
        .joystick .empty { visibility: hidden; } .joystick .up { grid-column: 2; grid-row: 1; } .joystick .left { grid-column: 1; grid-row: 2; } .joystick .right { grid-column: 3; grid-row: 2; } .joystick .down { grid-column: 2; grid-row: 3; }

        /* ===== ADVENTURE MODE ===== */
        #adventureOverlay { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(30,30,30,0.85); backdrop-filter: blur(4px); border: 10px solid #222; overflow: hidden; }
        #adventureOverlay.active { display: flex; }
        .close-adventure { position: absolute; top: 15px; right: 15px; background: #FF0000; border: 4px solid #222; border-radius: 10px; padding: 5px 15px; font-weight: 900; color: #FFF; cursor: pointer; z-index: 40; }

        .battle-arena { width: 90%; max-width: 800px; height: 85%; background: radial-gradient(circle at 20% 30%, #A3D9A5, #4A7C59); border-radius: 20px; border: 8px solid #222; position: relative; box-shadow: inset 0 -30px 0 #556B2F; overflow: hidden; }

        /* Player HP */
        .player-hp-container { position: absolute; bottom: 20px; left: 20px; width: 220px; background: #111; border-radius: 30px; padding: 4px; border: 3px solid #000; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .player-hp-bar { height: 20px; width: 100%; border-radius: 30px; transition: width 0.2s; background: linear-gradient(90deg, #FF0000, #FF8C00, #FFD700); box-shadow: 0 0 10px rgba(255,140,0,0.6); }
        .player-hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFF; font-weight: 900; font-size: 0.9rem; text-shadow: 0 0 4px #000; }

        /* Worm HP */
        .enemy-hp-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 60%; background: #111; border-radius: 30px; padding: 4px; border: 3px solid #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .enemy-hp-bar { height: 20px; width: 100%; background: #FF0000; border-radius: 30px; transition: width 0.2s; box-shadow: inset 0 0 10px rgba(255,0,0,0.5); }
        .enemy-hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFF; font-weight: 900; font-size: 0.9rem; text-shadow: 0 0 4px #000; }

        /* ===== NEW CUTE WORM ===== */
        .worm-container { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); z-index: 5; width: 160px; }
        .worm-segment { width: 100%; height: 45px; background: linear-gradient(180deg, #7CFC00, #32CD32); border-radius: 40px; border: 3px solid #228B22; box-shadow: inset -10px -10px 15px rgba(0,0,0,0.2), inset 10px 10px 15px rgba(255,255,255,0.3); transform: rotate(3deg); }
        .worm-segment:nth-child(2) { width: 80%; margin-left: 10px; margin-top: -12px; transform: rotate(-3deg); }
        .worm-segment:nth-child(3) { width: 60%; margin-left: 20px; margin-top: -12px; transform: rotate(3deg); }

        /* Big cute eyes and smile */
        .worm-face { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .worm-eyes { display: flex; gap: 25px; }
        .worm-eyes span { width: 32px; height: 32px; background: #FFF; border-radius: 50%; border: 4px solid #222; position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.15); }
        .worm-eyes span::after { content: ''; position: absolute; width: 14px; height: 14px; background: #000; border-radius: 50%; top: 6px; left: 6px; animation: googly 1.8s infinite alternate; }
        .worm-eyes span:last-child::after { left: 10px; animation-duration: 2.2s; }
        @keyframes googly { 0% { transform: translate(0,0); } 100% { transform: translate(-6px,6px); } }

        .worm-mouth { width: 35px; height: 18px; margin-top: 10px; background: #222; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 3px solid #000; overflow: visible; position: relative; }
        .worm-mouth::before { content: ''; position: absolute; width: 18px; height: 18px; background: #FF69B4; border-radius: 50%; top: 8px; left: 8px; border: 2px solid #222; animation: tongue 0.4s infinite alternate; }
        @keyframes tongue { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }

        /* ===== SPIKE PROJECTILE (slower) ===== */
        .spike-projectile { position: absolute; width: 35px; height: 35px; pointer-events: none; z-index: 15; animation: spinSpike 0.5s linear infinite; }
        @keyframes spinSpike { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spike-projectile::before { content: ''; position: absolute; top: 2px; left: 2px; width: 100%; height: 100%; background: #FF4500; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); box-shadow: 0 0 20px rgba(255,69,0,0.8); }
        .spike-projectile::after { content: ''; position: absolute; top: 4px; left: 4px; width: 27px; height: 27px; background: #FFD700; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); box-shadow: inset 0 -5px 10px #FFA500, 0 0 15px #FFD700; }

        /* ===== BATTLE PLAYER ===== */
        .battle-player { position: absolute; bottom: 10%; left: 20%; width: clamp(70px, 8vmin, 110px); height: auto; z-index: 10; }
        .battle-player img { width: 100%; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .battle-player .weapon-holder { width: 100%; height: 100%; right: -80%; top: -10%; transform: rotate(-15deg); display: none; }
        .battle-player .weapon-holder.active { display: block; }
        .battle-player .weapon-holder.parrying .shield-svg { animation: parrySwing 0.35s ease-in-out forwards; filter: drop-shadow(0 0 80px #FFF) brightness(1.8) drop-shadow(0 0 30px #FFD700); }

        /* ===== PARRY BUTTON ===== */
        .parry-btn { position: absolute; bottom: 5%; right: 10%; background: linear-gradient(135deg, #FFD700, #FFA500); border: 6px solid #222; border-radius: 20px; padding: 15px 35px; font-size: 1.8rem; font-weight: 900; color: #222; box-shadow: 0 10px 0 #B8860B; cursor: pointer; transition: 0.05s linear, transform 0.1s; text-shadow: 0 2px 0 #FFF; }
        .parry-btn:active { transform: translateY(6px) scale(0.95); box-shadow: 0 4px 0 #B8860B; background: #FFF; }
        .parry-btn:disabled { opacity: 0.5; transform: translateY(6px); box-shadow: 0 4px 0 #B8860B; pointer-events: none; }

        /* ===== SPARKLES ===== */
        .sparkle-particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; z-index: 20; }
        .sparkle-particle.yellow { background: #FFD700; box-shadow: 0 0 15px #FFD700; }
        .sparkle-particle.white { background: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

        /* ===== SHOP MODAL ===== */
        #shopModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        #shopModal.active { display: flex; }
        .shop-content { background: #FFF; padding: 30px; border-radius: 20px; border: 8px solid #222; text-align: center; min-width: 280px; }
        .shop-content h2 { color: #333; font-weight: 900; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: #EEE; padding: 15px; border-radius: 10px; margin: 20px 0; border: 4px solid #222; }
        .shop-item span { font-size: 1.1rem; font-weight: 900; }
        .shop-item .cost { color: #FDD835; }
        .shop-item button { background: #FDD835; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #B8860B; }
        .shop-item button:disabled { opacity: 0.5; transform: translateY(4px); box-shadow: none; pointer-events: none; }

        @media (max-width: 800px) { .tree-container { width: 80vmin; height: 90vmin; } }
        @media (max-width: 600px) {
            .menu-card { padding: 30px 20px; } .menu-card h1 { font-size: 2.5rem; } .play-btn svg { width: 120px; height: 80px; }
            .joystick { grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 4px; padding: 6px; }
            .joystick button { font-size: 1.6rem; } .ui-panel .title { font-size: 1rem; }
            .ui-panel .btn-group .btn-roblox { padding: 4px 10px; font-size: 0.8rem; } .parry-btn { font-size: 1.2rem; padding: 10px 20px; }
            .player-hp-container { width: 120px; }
        }
    </style>
</head>
<body>
    <div id="menu">
        <div class="menu-card">
            <h1>🍋 ADVENTURE OF LEMON</h1>
            <p>Buy the shield. Parry the spike. Deflect it back!</p>
            <button class="play-btn" onclick="startGame()">
                <svg viewBox="0 0 140 90">
                    <rect x="10" y="10" width="120" height="70" rx="20" fill="#FDD835" stroke="#C17900" stroke-width="6"/>
                    <text x="70" y="60" text-anchor="middle" fill="#222" font-size="36" font-weight="900" stroke="#000" stroke-width="2">PLAY</text>
                </svg>
            </button>
        </div>
    </div>

    <div id="game" onclick="resumeAudio()">
        <div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
        <div class="tree-container"><div class="trunk"></div><div class="canopy" id="canopy"><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div><div class="leaf-cluster"></div></div></div>

        <div class="ui-panel">
            <div class="title">LEMON QUEST</div>
            <span class="score" id="scoreDisplay">🍋 0</span>
            <div class="btn-group">
                <button class="btn-roblox adventure" id="adventureBtn">⚔️ ADVENTURES</button>
                <button class="btn-roblox shop" id="shopBtn">🛒 SHOP</button>
            </div>
        </div>

        <div id="player-wrapper">
            <img id="player" alt="Lemon Character">
            <div class="weapon-holder" id="weaponHolder">
                <svg class="shield-svg" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="30" fill="#C0C0C0" stroke="#888" stroke-width="6"/>
                    <circle cx="40" cy="40" r="22" fill="#FFD700" stroke="#B8860B" stroke-width="4"/>
                    <circle cx="40" cy="40" r="14" fill="#8B4513" stroke="#3D1A00" stroke-width="3"/>
                    <circle cx="40" cy="40" r="6" fill="#FFF" filter="url(#glow)"/>
                    <defs><filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                </svg>
            </div>
        </div>

        <div class="joystick">
            <button class="up" data-dir="up">▲</button>
            <button class="left" data-dir="left">◄</button>
            <button class="empty"></button>
            <button class="right" data-dir="right">►</button>
            <button class="down" data-dir="down">▼</button>
        </div>

        <div id="adventureOverlay">
            <button class="close-adventure" onclick="closeAdventure()">✕</button>
            <div class="battle-arena" id="battleArena">
                <div class="player-hp-container">
                    <div class="player-hp-bar" id="playerHPBar"></div>
                    <div class="player-hp-text" id="playerHPText">67 / 67</div>
                </div>

                <div class="enemy-hp-container">
                    <div class="enemy-hp-bar" id="wormHPBar"></div>
                    <div class="enemy-hp-text" id="wormHPText">HP: 50 / 50</div>
                </div>
                
                <!-- CUTE NEW WORM -->
                <div class="worm-container" id="wormContainer">
                    <div class="worm-face">
                        <div class="worm-eyes"><span></span><span></span></div>
                        <div class="worm-mouth"></div>
                    </div>
                    <div class="worm-segment"></div>
                    <div class="worm-segment"></div>
                    <div class="worm-segment"></div>
                </div>

                <div class="battle-player" id="battlePlayer">
                    <img id="battleImg" src="">
                    <div class="weapon-holder" id="battleWeaponHolder">
                        <svg class="shield-svg" viewBox="0 0 80 80">
                            <circle cx="40" cy="40" r="30" fill="#C0C0C0" stroke="#888" stroke-width="6"/>
                            <circle cx="40" cy="40" r="22" fill="#FFD700" stroke="#B8860B" stroke-width="4"/>
                            <circle cx="40" cy="40" r="14" fill="#8B4513" stroke="#3D1A00" stroke-width="3"/>
                            <circle cx="40" cy="40" r="6" fill="#FFF" filter="url(#glow)"/>
                        </svg>
                    </div>
                </div>
                <button class="parry-btn" id="parryBtn" onclick="activateParry()">🛡️ PARRY</button>
            </div>
        </div>
    </div>

    <div id="shopModal">
        <div class="shop-content">
            <h2>🍋 LEMON SHOP</h2>
            <div class="shop-item">
                <span>🛡️ PARRY SHIELD</span>
                <span class="cost">150 🍋</span>
                <button id="buyWeaponBtn" onclick="buyWeapon()">BUY</button>
            </div>
            <button class="close-shop" onclick="closeShop()">CLOSE</button>
        </div>
    </div>

    <script>
        // ===== AUDIO =====
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
        function playTone(f, d, t='sine', v=0.3) {
            if (!audioCtx) return;
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = t; o.frequency.value = f;
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e) {}
        }
        function playCollect() { playTone(523,0.1); setTimeout(()=>playTone(659,0.1),80); }
        function playBuy() { playTone(440,0.15,'triangle',0.3); setTimeout(()=>playTone(554,0.15,'triangle',0.3),150); }
        function playWormHit() { playTone(200,0.2,'sawtooth',0.2); playTone(150,0.3,'square',0.1); }
        function playParrySound() {
            playTone(1200,0.05,'square',0.4);
            setTimeout(()=>playTone(800,0.08,'sine',0.3),20);
            setTimeout(()=>playTone(1600,0.1,'sawtooth',0.25),40);
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i=0; i<bufferSize; i++) data[i] = (Math.random()*2-1)*(1 - i/bufferSize);
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.1);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        // ===== GENERATE LEMON =====
        function generateLemonSprite() {
            const c = document.createElement('canvas'); c.width=256; c.height=256;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(80,70,20,128,128,120);
            grad.addColorStop(0,'#FFF59D'); grad.addColorStop(0.3,'#FDD835'); grad.addColorStop(0.8,'#F9A825'); grad.addColorStop(1,'#C17900');
            ctx.beginPath(); ctx.ellipse(128,128,110,80,0,0,Math.PI*2);
            ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#B8860B'; ctx.lineWidth=4; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(90,100,40,20,-0.3,0,Math.PI*2);
            ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(128,48); ctx.lineTo(116,20); ctx.lineTo(140,20); ctx.closePath();
            ctx.fillStyle='#4CAF50'; ctx.fill(); ctx.strokeStyle='#2E7D32'; ctx.lineWidth=2; ctx.stroke();
            ctx.strokeStyle='#000'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.lineJoin='round';
            ctx.beginPath(); ctx.moveTo(95,100); ctx.lineTo(95,140); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(161,100); ctx.lineTo(161,140); ctx.stroke();
            ctx.beginPath(); ctx.arc(128,148,32,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
            ctx.fillStyle='rgba(255,100,100,0.3)';
            ctx.beginPath(); ctx.ellipse(70,150,20,10,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(186,150,20,10,0,0,Math.PI*2); ctx.fill();
            return c.toDataURL('image/png');
        }

        // ===== GAME ENGINE =====
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const playerWrapper = document.getElementById('player-wrapper');
        const playerImg = document.getElementById('player');
        const battlePlayerImg = document.getElementById('battleImg');
        const scoreSpan = document.getElementById('scoreDisplay');
        const canopy = document.getElementById('canopy');
        const shopModal = document.getElementById('shopModal');
        const shopBtn = document.getElementById('shopBtn');
        const buyWeaponBtn = document.getElementById('buyWeaponBtn');
        const adventureOverlay = document.getElementById('adventureOverlay');
        const adventureBtn = document.getElementById('adventureBtn');
        const parryBtn = document.getElementById('parryBtn');
        const wormHPBar = document.getElementById('wormHPBar');
        const wormHPText = document.getElementById('wormHPText');
        const playerHPBar = document.getElementById('playerHPBar');
        const playerHPText = document.getElementById('playerHPText');
        const weaponHolder = document.getElementById('weaponHolder');
        const battleWeaponHolder = document.getElementById('battleWeaponHolder');
        const battleArena = document.getElementById('battleArena');

        let x=0, y=0, score=0, moveInterval=null;
        const STEP=18;
        let lemonFruits=[];
        let weaponOwned=false;
        let wormMaxHP=50, wormHP=50;
        let playerMaxHP=67, playerHP=67;
        let isSpikeActive=false, spikeElement=null;
        let spikeSpeed=3; // SLOWER
        let spikeDX=0, spikeDY=0;
        let wormAttackTimer=0;
        let isParrying=false, isSpikeDeflected=false;
        let arenaLoopId=null;

        function startGame() {
            initAudio();
            const s = generateLemonSprite();
            playerImg.src=s; battlePlayerImg.src=s;
            menu.classList.add('hidden');
            setTimeout(()=>menu.style.display='none',800);
            game.style.display='block';
            centerPlayer();
            spawnLemons(20);
            score=0; updateScore();
            if (localStorage.getItem('weaponOwned')==='true') {
                weaponOwned=true; buyWeaponBtn.disabled=true; buyWeaponBtn.textContent='OWNED';
            }
        }
        function centerPlayer() { x=window.innerWidth/2; y=window.innerHeight/2; updatePosition(false); }
        function updatePosition(bounce) {
            playerWrapper.style.left=x+'px'; playerWrapper.style.top=y+'px';
            if (bounce) { playerWrapper.classList.add('bounce'); setTimeout(()=>playerWrapper.classList.remove('bounce'),350); }
        }
        function move(dx, dy) {
            const nX=Math.min(Math.max(x+dx,10), window.innerWidth-10);
            const nY=Math.min(Math.max(y+dy,10), window.innerHeight-10);
            if (nX!==x || nY!==y) { x=nX; y=nY; updatePosition(true); checkLemonCollection(); return true; }
            return false;
        }
        function updateScore() {
            scoreSpan.textContent='🍋 '+score;
            if (score>=150 && !weaponOwned) buyWeaponBtn.disabled=false;
            else buyWeaponBtn.disabled=true;
        }
        function spawnLemons(c) { lemonFruits.forEach(f=>f.remove()); lemonFruits=[]; for(let i=0;i<c;i++) createLemon(); }
        function createLemon() {
            const l=document.createElement('div'); l.className='lemon-fruit'; l.textContent='🍋';
            l.style.left=(5+Math.random()*90)+'%'; l.style.top=(5+Math.random()*90)+'%';
            l.style.fontSize=(3+Math.random()*2)+'vmin';
            canopy.appendChild(l); lemonFruits.push(l);
        }
        function checkLemonCollection() {
            const r=playerWrapper.getBoundingClientRect();
            const cx=r.left+r.width/2, cy=r.top+r.height/2;
            for (let i=lemonFruits.length-1;i>=0;i--) {
                const l=lemonFruits[i];
                const lr=l.getBoundingClientRect();
                if (Math.hypot(cx-(lr.left+lr.width/2), cy-(lr.top+lr.height/2)) < 70) {
                    l.remove(); lemonFruits.splice(i,1);
                    score+=5; updateScore(); playCollect(); createLemon(); break;
                }
            }
        }
        function moveUp(){move(0,-STEP);} function moveDown(){move(0,STEP);}
        function moveLeft(){move(-STEP,0);} function moveRight(){move(STEP,0);}
        document.addEventListener('keydown', e=>{ if(!e.key.startsWith('Arrow'))return; e.preventDefault(); switch(e.key){ case'ArrowUp':moveUp();break; case'ArrowDown':moveDown();break; case'ArrowLeft':moveLeft();break; case'ArrowRight':moveRight();break; } });
        document.querySelectorAll('.joystick button:not(.empty)').forEach(b=>{
            const d=b.dataset.dir;
            const s=e=>{ e.preventDefault(); b.classList.add('active'); switch(d){ case'up':moveUp();break; case'down':moveDown();break; case'left':moveLeft();break; case'right':moveRight();break; } if(moveInterval)clearInterval(moveInterval); moveInterval=setInterval(()=>{ switch(d){ case'up':moveUp();break; case'down':moveDown();break; case'left':moveLeft();break; case'right':moveRight();break; } },70); };
            const st=e=>{ e.preventDefault(); b.classList.remove('active'); if(moveInterval){clearInterval(moveInterval);moveInterval=null;} };
            b.addEventListener('mousedown',s); b.addEventListener('mouseup',st); b.addEventListener('mouseleave',st);
            b.addEventListener('touchstart',s,{passive:false}); b.addEventListener('touchend',st,{passive:false});
        });
        window.addEventListener('resize', ()=>{ const mx=window.innerWidth-10, my=window.innerHeight-10; if(x>mx)x=mx; if(y>my)y=my; updatePosition(false); });

        // SHOP
        shopBtn.addEventListener('click', ()=>{ shopModal.classList.add('active'); });
        function closeShop(){ shopModal.classList.remove('active'); }
        function buyWeapon(){ if(score>=150 && !weaponOwned){ score-=150; updateScore(); weaponOwned=true; localStorage.setItem('weaponOwned','true'); buyWeaponBtn.disabled=true; buyWeaponBtn.textContent='OWNED'; playBuy(); closeShop(); } }

        // COLLISION
        function rectIntersect(r1, r2) {
            return !(r2.left > r1.right || r2.right < r1.left || r2.top > r1.bottom || r2.bottom < r1.top);
        }

        // ADVENTURE LOOP
        function startAdventureLoop() {
            if (arenaLoopId) cancelAnimationFrame(arenaLoopId);
            wormAttackTimer=0;
            arenaLoop();
        }
        function arenaLoop() {
            if (!adventureOverlay.classList.contains('active')) return;
            wormAttackTimer++;
            // Shoot every ~1.5 seconds (90 frames at 60fps)
            if (wormAttackTimer >= 90 && !isSpikeActive && wormHP > 0) {
                wormAttackTimer = 0;
                shootSpike();
            }
            if (isSpikeActive && spikeElement) {
                const rect = spikeElement.getBoundingClientRect();
                let curX = rect.left, curY = rect.top;
                let dx = spikeDX, dy = spikeDY;
                if (isSpikeDeflected) {
                    const wRect = document.getElementById('wormContainer').getBoundingClientRect();
                    const wCX = wRect.left + wRect.width/2;
                    const wCY = wRect.top + wRect.height/2;
                    const ddx = wCX - curX, ddy = wCY - curY;
                    const hyp = Math.hypot(ddx, ddy);
                    if (hyp > 0) { dx = (ddx/hyp)*14; dy = (ddy/hyp)*14; }
                }
                const newX = curX + dx, newY = curY + dy;
                spikeElement.style.left = (newX - 17.5) + 'px';
                spikeElement.style.top = (newY - 17.5) + 'px';

                const spikeRect = spikeElement.getBoundingClientRect();
                if (!isSpikeDeflected) {
                    const pRect = document.querySelector('.battle-player').getBoundingClientRect();
                    if (rectIntersect(spikeRect, pRect)) {
                        playerHP -= 5; updatePlayerHPUI(); playWormHit(); resetSpike();
                        if (playerHP <= 0) { alert("GAME OVER!"); closeAdventure(); playerHP=playerMaxHP; updatePlayerHPUI(); }
                        return;
                    }
                } else {
                    const wRect = document.getElementById('wormContainer').getBoundingClientRect();
                    if (rectIntersect(spikeRect, wRect)) {
                        wormHP -= 5; updateWormUI(); playWormHit(); resetSpike();
                        if (wormHP <= 0) { setTimeout(()=>{ score+=25; updateScore(); wormHP=wormMaxHP; updateWormUI(); },200); }
                        return;
                    }
                }
            }
            arenaLoopId = requestAnimationFrame(arenaLoop);
        }

        function shootSpike() {
            if (isSpikeActive || wormHP <= 0) return;
            const wRect = document.getElementById('wormContainer').getBoundingClientRect();
            const pRect = document.querySelector('.battle-player').getBoundingClientRect();
            const arenaRect = battleArena.getBoundingClientRect();
            const startX = wRect.right - arenaRect.left - 20;
            const startY = wRect.top - arenaRect.top + 20;
            spikeElement = document.createElement('div');
            spikeElement.className = 'spike-projectile';
            spikeElement.style.left = startX + 'px';
            spikeElement.style.top = startY + 'px';
            battleArena.appendChild(spikeElement);
            // Aim at player's center
            const targetX = pRect.left + pRect.width/2;
            const targetY = pRect.top + pRect.height/2;
            const dx = targetX - (wRect.right);
            const dy = targetY - (wRect.top + 20);
            const hyp = Math.hypot(dx, dy);
            if (hyp > 0) { spikeDX = (dx/hyp)*spikeSpeed; spikeDY = (dy/hyp)*spikeSpeed; }
            isSpikeActive = true;
            isSpikeDeflected = false;
        }

        function resetSpike() {
            if (spikeElement) { spikeElement.remove(); spikeElement = null; }
            isSpikeActive = false;
            isSpikeDeflected = false;
            // Reset timer so next shot happens soon
            wormAttackTimer = 80; // small delay before next shot
        }

        // SPARKLES
        function createSparkles(x, y) {
            const colors = ['#FFD700','#FFF','#FFA500','#FFFF00'];
            for (let i=0; i<30; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle-particle ' + (colors[Math.floor(Math.random()*colors.length)]);
                const angle = Math.random()*Math.PI*2;
                const dist = 30 + Math.random()*120;
                const tx = Math.cos(angle)*dist, ty = Math.sin(angle)*dist;
                s.style.left = (x-6)+'px'; s.style.top = (y-6)+'px';
                s.style.setProperty('--tx', tx+'px'); s.style.setProperty('--ty', ty+'px');
                s.style.animation = `sparkleBurst 0.6s ease-out forwards`;
                s.style.transform = `scale(${0.5+Math.random()})`;
                const style = document.createElement('style');
                style.textContent = `@keyframes sparkleBurst { 0%{transform:translate(0,0) scale(1);opacity:1;} 100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;} }`;
                document.head.appendChild(style);
                battleArena.appendChild(s);
                setTimeout(()=>s.remove(),700);
            }
        }

        function activateParry() {
            if (!isSpikeActive || isParrying) return;
            isParrying = true;
            parryBtn.disabled = true;
            battleWeaponHolder.classList.add('parrying');
            weaponHolder.classList.add('parrying');
            const sRect = spikeElement.getBoundingClientRect();
            const pRect = document.querySelector('.battle-player').getBoundingClientRect();
            const pCX = pRect.left + pRect.width/2;
            const pCY = pRect.top + pRect.height/2;
            const sCX = sRect.left + sRect.width/2;
            const sCY = sRect.top + sRect.height/2;
            if (Math.hypot(pCX - sCX, pCY - sCY) < 200) {
                playParrySound();
                createSparkles(pCX, pCY);
                isSpikeDeflected = true;
                spikeSpeed = 16;
                setTimeout(()=>{ battleWeaponHolder.classList.remove('parrying'); weaponHolder.classList.remove('parrying'); isParrying=false; parryBtn.disabled=false; },350);
            } else {
                setTimeout(()=>{ battleWeaponHolder.classList.remove('parrying'); weaponHolder.classList.remove('parrying'); isParrying=false; parryBtn.disabled=false; },200);
            }
        }

        function updateWormUI() {
            const p = (wormHP/wormMaxHP)*100;
            wormHPBar.style.width = Math.max(0,p)+'%';
            wormHPText.textContent = 'HP: '+Math.max(0,wormHP)+' / '+wormMaxHP;
        }
        function updatePlayerHPUI() {
            const p = (playerHP/playerMaxHP)*100;
            playerHPBar.style.width = Math.max(0,p)+'%';
            playerHPText.textContent = Math.max(0,playerHP)+' / '+playerMaxHP;
        }

        adventureBtn.addEventListener('click', ()=>{
            if(!weaponOwned){ alert('You need to buy the Parry Shield in the Shop first!'); return; }
            adventureOverlay.classList.add('active');
            wormHP = wormMaxHP; updateWormUI();
            playerHP = playerMaxHP; updatePlayerHPUI();
            battleWeaponHolder.classList.add('active');
            weaponHolder.classList.add('active');
            parryBtn.disabled = false;
            isSpikeActive = false;
            isParrying = false;
            startAdventureLoop();
        });
        function closeAdventure(){
            adventureOverlay.classList.remove('active');
            battleWeaponHolder.classList.remove('active');
            weaponHolder.classList.remove('active');
            resetSpike();
            if (arenaLoopId) cancelAnimationFrame(arenaLoopId);
        }

        menu.style.display='flex'; game.style.display='none';
        window.addEventListener('load', ()=>{ spawnLemons(20); });
    </script>
</body>
</html>
