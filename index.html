<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure of Lemon</title>
    <style>
        /* ===== COMPILED CSS FROM SCSS (ROBLOX STYLE) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Arial Black', sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #6DC6E4;
        }
        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('menu_bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        #menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        #menu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-card {
            position: relative;
            z-index: 1;
            background: #FFFFFF;
            padding: 50px 70px;
            border-radius: 16px;
            border: 8px solid #FDD835;
            box-shadow: 0 16px 0 #B8860B, 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 90vw;
        }
        .menu-card h1 {
            font-size: 4.2rem;
            color: #333;
            text-shadow: 4px 4px 0 #FDD835;
            margin-bottom: 10px;
        }
        .menu-card p {
            color: #555;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .play-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .play-btn:active {
            transform: scale(0.9);
        }
        .play-btn svg {
            width: 180px;
            height: 120px;
            transition: transform 0.15s ease;
        }
        .play-btn:hover svg {
            transform: scale(1.1);
        }
        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            background: #6DC6E4;
            overflow: hidden;
        }
        .tree-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vmin;
            height: 95vmin;
            pointer-events: none;
            z-index: 1;
        }
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14%;
            height: 45%;
            background: #8B5A2B;
            border-radius: 10px 10px 0 0;
            box-shadow: inset -10px 0 15px rgba(0,0,0,0.3);
            border: 6px solid #5D3A1A;
        }
        .branch {
            position: absolute;
            background: #8B5A2B;
            border-radius: 10px;
            border: 6px solid #5D3A1A;
            box-shadow: inset -5px 0 8px rgba(0,0,0,0.3);
        }
        .branch-1 { width: 35%; height: 8%; top: 30%; left: -25%; transform: rotate(-35deg); }
        .branch-2 { width: 40%; height: 8%; top: 20%; right: -30%; transform: rotate(40deg); }
        .branch-3 { width: 30%; height: 7%; top: 10%; left: -15%; transform: rotate(-25deg); }
        .branch-4 { width: 32%; height: 7%; top: 5%; right: -20%; transform: rotate(30deg); }
        .canopy {
            position: absolute;
            top: -25%;
            left: 50%;
            transform: translateX(-50%);
            width: 160%;
            height: 85%;
            border-radius: 50%;
            background: #2E8B57;
            border: 8px solid #1E5A3A;
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.3);
            overflow: visible;
            z-index: 1;
        }
        .leaf-cluster {
            position: absolute;
            border-radius: 40%;
            background: #3CB371;
            border: 6px solid #2E8B57;
        }
        .leaf-cluster:nth-child(1) { width: 40%; height: 40%; top: 5%; left: -15%; }
        .leaf-cluster:nth-child(2) { width: 50%; height: 50%; top: -10%; right: -20%; }
        .leaf-cluster:nth-child(3) { width: 35%; height: 35%; bottom: 10%; left: 20%; }
        .leaf-cluster:nth-child(4) { width: 30%; height: 30%; bottom: 5%; right: 15%; }
        .leaf-cluster:nth-child(5) { width: 25%; height: 25%; top: 30%; left: 5%; }
        .lemon-fruit {
            position: absolute;
            font-size: 4vmin;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
            transition: transform 0.1s;
            z-index: 2;
        }
        .lemon-fruit:active {
            transform: scale(1.3);
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            padding: 10px 24px;
            background: #FFFFFF;
            border-radius: 12px;
            border: 8px solid #222222;
            box-shadow: 0 10px 0 #111111, 0 10px 20px rgba(0,0,0,0.3);
        }
        .ui-panel .title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #333;
        }
        .ui-panel .score {
            font-size: 1.4rem;
            font-weight: 900;
            color: #FDD835;
            background: #222222;
            padding: 4px 20px;
            border-radius: 8px;
            border: 2px solid #111111;
        }
        .ui-panel .btn-group {
            display: flex;
            gap: 12px;
        }
        .btn-roblox {
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #222;
            cursor: pointer;
            box-shadow: 0 8px 0;
            transition: transform 0.05s, box-shadow 0.05s;
            border: 4px solid #222222;
        }
        .btn-roblox:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0;
        }
        .btn-roblox.adventure {
            background: #4169E1;
            color: #FFFFFF;
            box-shadow: 0 8px 0 #1E3A8A;
        }
        .btn-roblox.shop {
            background: #FF4500;
            color: #FFFFFF;
            box-shadow: 0 8px 0 #B22222;
        }
        #player-wrapper {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: clamp(70px, 12vmin, 150px);
            height: auto;
        }
        #player-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 30%;
            filter: drop-shadow(0 10px 20px rgba(255,215,0,0.4));
            object-fit: contain;
            animation: lemonIdle 2.2s ease-in-out infinite;
        }
        #player-wrapper.bounce img {
            animation: none;
            animation: lemonBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #player-wrapper .sword-holder {
            position: absolute;
            display: none;
            z-index: 11;
            width: 60%;
            height: 80%;
            right: -40%;
            top: -10%;
            transform: rotate(-45deg);
        }
        #player-wrapper .sword-holder.active {
            display: block;
        }
        #player-wrapper .sword-holder svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px #FFFFFF);
        }
        @keyframes lemonIdle {
            0% { transform: rotate(-3deg) scale(1); }
            30% { transform: rotate(3deg) scale(1.04) translateY(-4px); }
            60% { transform: rotate(-2deg) scale(0.96) translateY(2px); }
            100% { transform: rotate(-3deg) scale(1); }
        }
        @keyframes lemonBounce {
            0% { transform: scale(1) rotate(0); }
            25% { transform: scale(1.35) rotate(12deg) translateY(-18px); }
            50% { transform: scale(0.75) rotate(-6deg) translateY(12px); }
            75% { transform: scale(1.15) rotate(4deg) translateY(-8px); }
            100% { transform: scale(1) rotate(0) translateY(0); }
        }
        .joystick {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px 80px;
            gap: 6px;
            z-index: 20;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 20px;
            border: 8px solid #222222;
            box-shadow: 0 14px 0 #111111, 0 20px 40px rgba(0,0,0,0.3);
        }
        .joystick button {
            background: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: 900;
            color: #222222;
            cursor: pointer;
            box-shadow: 0 8px 0 #888888;
            transition: transform 0.05s, box-shadow 0.05s;
            touch-action: none;
            outline: none;
            border: 4px solid #222222;
        }
        .joystick button:active,
        .joystick button.active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #888888;
            background: #FDD835;
        }
        .joystick .empty { visibility: hidden; }
        .joystick .up { grid-column: 2; grid-row: 1; }
        .joystick .left { grid-column: 1; grid-row: 2; }
        .joystick .right { grid-column: 3; grid-row: 2; }
        .joystick .down { grid-column: 2; grid-row: 3; }
        #adventureOverlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #3CB371;
            border: 10px solid #222222;
            overflow: hidden;
        }
        #adventureOverlay.active {
            display: flex;
        }
        #adventureOverlay .close-adventure {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FF0000;
            border: 4px solid #222222;
            border-radius: 10px;
            padding: 5px 15px;
            font-weight: 900;
            color: #FFFFFF;
            cursor: pointer;
        }
        #adventureOverlay .battle-arena {
            width: 90%;
            max-width: 600px;
            height: 70%;
            background: #8FBC8F;
            border-radius: 20px;
            border: 8px solid #222222;
            position: relative;
            box-shadow: inset 0 -30px 0 #556B2F;
        }
        #adventureOverlay .battle-arena .enemy-hp-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: #222222;
            border-radius: 20px;
            padding: 4px;
            border: 3px solid #000000;
        }
        #adventureOverlay .battle-arena .enemy-hp-container .enemy-hp-bar {
            height: 20px;
            width: 100%;
            background: #FF0000;
            border-radius: 15px;
            transition: width 0.2s;
        }
        #adventureOverlay .battle-arena .enemy-hp-container .enemy-hp-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 900;
            font-size: 0.9rem;
        }
        #adventureOverlay .battle-arena .worm {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        #adventureOverlay .battle-arena .worm .worm-eyes {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            width: 40px;
            height: 20px;
        }
        #adventureOverlay .battle-arena .worm .worm-eyes span {
            width: 20px;
            height: 20px;
            background: #FFFFFF;
            border-radius: 50%;
            border: 3px solid #222222;
        }
        #adventureOverlay .battle-arena .worm .worm-segment {
            width: 70px;
            height: 40px;
            background: #8B4513;
            border-radius: 30px;
            border: 4px solid #5C2E0B;
            box-shadow: inset -5px -5px 0 #5C2E0B;
        }
        #adventureOverlay .battle-arena .worm .worm-segment:nth-child(2) {
            width: 60px;
            height: 35px;
            margin-left: 10px;
        }
        #adventureOverlay .battle-arena .worm .worm-segment:nth-child(3) {
            width: 50px;
            height: 30px;
            margin-left: 20px;
        }
        #adventureOverlay .battle-arena .battle-player {
            position: absolute;
            bottom: 10%;
            left: 20%;
            width: clamp(70px, 10vmin, 120px);
            height: auto;
            z-index: 10;
        }
        #adventureOverlay .battle-arena .battle-player img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        #adventureOverlay .battle-arena .battle-player .sword-holder {
            width: 80%;
            height: 100%;
            right: -50%;
            top: -10%;
            transform: rotate(-30deg);
        }
        #adventureOverlay .battle-arena .battle-player .sword-holder.active {
            display: block;
        }
        #adventureOverlay .battle-arena .attack-btn {
            position: absolute;
            bottom: 5%;
            right: 10%;
            background: #FF4500;
            border: 6px solid #222222;
            border-radius: 20px;
            padding: 15px 40px;
            font-size: 2rem;
            font-weight: 900;
            color: #FFFFFF;
            box-shadow: 0 12px 0 #B22222;
            cursor: pointer;
            transition: 0.05s linear;
        }
        #adventureOverlay .battle-arena .attack-btn:active {
            transform: translateY(6px);
            box-shadow: 0 6px 0 #B22222;
        }
        #adventureOverlay .battle-arena .attack-btn:disabled {
            opacity: 0.5;
            transform: translateY(6px);
            box-shadow: 0 6px 0 #B22222;
            pointer-events: none;
        }
        #shopModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        #shopModal.active {
            display: flex;
        }
        #shopModal .shop-content {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 20px;
            border: 8px solid #222222;
            text-align: center;
            min-width: 300px;
        }
        #shopModal .shop-content h2 {
            color: #333;
            font-weight: 900;
        }
        #shopModal .shop-content .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #EEEEEE;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 4px solid #222222;
        }
        #shopModal .shop-content .shop-item span {
            font-size: 1.2rem;
            font-weight: 900;
        }
        #shopModal .shop-content .shop-item .cost {
            color: #FDD835;
            font-weight: 900;
        }
        #shopModal .shop-content .shop-item button {
            background: #FDD835;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #B8860B;
        }
        #shopModal .shop-content .shop-item button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 0px 0 #B8860B;
            pointer-events: none;
        }
        #shopModal .shop-content .close-shop {
            background: #333333;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #FFFFFF;
            font-weight: 900;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .menu-card h1 { font-size: 2.8rem; padding: 20px; }
            .joystick { grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; }
            .joystick button { font-size: 1.8rem; }
            .ui-panel .title { font-size: 1rem; }
            .ui-panel .btn-group .btn-roblox { padding: 4px 12px; font-size: 0.8rem; }
            #adventureOverlay .battle-arena .attack-btn { font-size: 1.2rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <!-- MENU -->
    <div id="menu">
        <div class="menu-card">
            <h1>ADVENTURE OF LEMON</h1>
            <p>Collect lemons. Buy the Sword. Fight worms!</p>
            <button class="play-btn" onclick="startGame()">
                <svg viewBox="0 0 140 90">
                    <rect x="10" y="10" width="120" height="70" rx="20" fill="#FDD835" stroke="#C17900" stroke-width="6"/>
                    <text x="70" y="60" text-anchor="middle" fill="#222" font-size="36" font-weight="900" stroke="#000" stroke-width="2">PLAY</text>
                </svg>
            </button>
        </div>
    </div>

    <!-- GAME -->
    <div id="game">
        <div class="tree-container">
            <div class="trunk"></div>
            <div class="branch branch-1"></div>
            <div class="branch branch-2"></div>
            <div class="branch branch-3"></div>
            <div class="branch branch-4"></div>
            <div class="canopy" id="canopy">
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
                <div class="leaf-cluster"></div>
            </div>
        </div>

        <div class="ui-panel">
            <div class="title">LEMON QUEST</div>
            <span class="score" id="scoreDisplay">LEMONS: 0</span>
            <div class="btn-group">
                <button class="btn-roblox adventure" id="adventureBtn">ADVENTURES</button>
                <button class="btn-roblox shop" id="shopBtn">SHOP</button>
            </div>
        </div>

        <!-- Player character - change this file to the image you just uploaded -->
        <div id="player-wrapper">
            <img id="player" src="smile_lemon.png" alt="Smile Lemon">
            <div class="sword-holder" id="swordHolder">
                <svg viewBox="0 0 50 100">
                    <rect x="20" y="10" width="10" height="60" fill="#CCC" stroke="#333" stroke-width="3"/>
                    <rect x="5" y="60" width="40" height="15" fill="#FFD700" stroke="#B8860B" stroke-width="3"/>
                    <rect x="18" y="15" width="14" height="8" fill="#333"/>
                    <circle cx="25" cy="20" r="4" fill="#F00"/>
                </svg>
            </div>
        </div>

        <div class="joystick">
            <button class="up" data-dir="up">▲</button>
            <button class="left" data-dir="left">◄</button>
            <button class="empty"></button>
            <button class="right" data-dir="right">►</button>
            <button class="down" data-dir="down">▼</button>
        </div>

        <div id="adventureOverlay">
            <button class="close-adventure" onclick="closeAdventure()">X</button>
            <div class="battle-arena" id="battleArena">
                <div class="enemy-hp-container">
                    <div class="enemy-hp-bar" id="wormHPBar"></div>
                    <div class="enemy-hp-text" id="wormHPText">HP: 50 / 50</div>
                </div>
                <div class="worm" id="wormContainer">
                    <div class="worm-eyes"><span></span><span></span></div>
                    <div class="worm-segment"></div>
                    <div class="worm-segment"></div>
                    <div class="worm-segment"></div>
                </div>
                <div class="battle-player" id="battlePlayer">
                    <img src="smile_lemon.png">
                    <div class="sword-holder" id="battleSwordHolder">
                        <svg viewBox="0 0 50 100">
                            <rect x="20" y="10" width="10" height="60" fill="#CCC" stroke="#333" stroke-width="3"/>
                            <rect x="5" y="60" width="40" height="15" fill="#FFD700" stroke="#B8860B" stroke-width="3"/>
                            <rect x="18" y="15" width="14" height="8" fill="#333"/>
                            <circle cx="25" cy="20" r="4" fill="#F00"/>
                        </svg>
                    </div>
                </div>
                <button class="attack-btn" id="attackBtn" onclick="attackWorm()">ATTACK</button>
            </div>
        </div>
    </div>

    <div id="shopModal">
        <div class="shop-content">
            <h2>LEMON SHOP</h2>
            <div class="shop-item">
                <span>SWORD OF ZEST</span>
                <span class="cost">150 LEMONS</span>
                <button id="buySwordBtn" onclick="buySword()">BUY</button>
            </div>
            <button class="close-shop" onclick="closeShop()">CLOSE</button>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const playerWrapper = document.getElementById('player-wrapper');
        const scoreSpan = document.getElementById('scoreDisplay');
        const canopy = document.getElementById('canopy');
        const shopModal = document.getElementById('shopModal');
        const shopBtn = document.getElementById('shopBtn');
        const buySwordBtn = document.getElementById('buySwordBtn');
        const adventureOverlay = document.getElementById('adventureOverlay');
        const adventureBtn = document.getElementById('adventureBtn');
        const attackBtn = document.getElementById('attackBtn');
        const wormHPBar = document.getElementById('wormHPBar');
        const wormHPText = document.getElementById('wormHPText');
        const swordHolder = document.getElementById('swordHolder');
        const battleSwordHolder = document.getElementById('battleSwordHolder');

        let x = 0, y = 0, score = 0, moveInterval = null;
        const STEP = 18;
        let lemonFruits = [];
        let audioCtx = null;
        let swordOwned = false;
        let wormMaxHP = 50;
        let wormHP = 50;
        let isAttacking = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playTone(freq, duration, type = 'sine', vol = 0.3) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playCollect() { playTone(523, 0.1, 'sine', 0.2); setTimeout(() => playTone(659, 0.1, 'sine', 0.2), 80); }
        function playSword() { playTone(200, 0.2, 'sawtooth', 0.2); playTone(300, 0.15, 'sawtooth', 0.2); }
        function playBuy() { playTone(440, 0.15, 'triangle', 0.3); setTimeout(() => playTone(554, 0.15, 'triangle', 0.3), 150); }

        function startGame() {
            initAudio();
            menu.classList.add('hidden');
            setTimeout(() => menu.style.display = 'none', 800);
            game.style.display = 'block';
            centerPlayer();
            spawnLemons(20);
            score = 0; updateScore();
            if (localStorage.getItem('swordOwned') === 'true') { swordOwned = true; buySwordBtn.disabled = true; buySwordBtn.textContent = 'OWNED'; }
        }

        function centerPlayer() { x = window.innerWidth / 2; y = window.innerHeight / 2; updatePosition(false); }
        function updatePosition(bounce = true) {
            playerWrapper.style.left = x + 'px'; playerWrapper.style.top = y + 'px';
            if (bounce) { playerWrapper.classList.add('bounce'); setTimeout(() => playerWrapper.classList.remove('bounce'), 350); }
        }

        function move(dx, dy) {
            const newX = Math.min(Math.max(x + dx, 10), window.innerWidth - 10);
            const newY = Math.min(Math.max(y + dy, 10), window.innerHeight - 10);
            if (newX !== x || newY !== y) { x = newX; y = newY; updatePosition(true); checkLemonCollection(); return true; }
            return false;
        }

        function updateScore() {
            scoreSpan.textContent = 'LEMONS: ' + score;
            if (score >= 150 && !swordOwned) buySwordBtn.disabled = false; else buySwordBtn.disabled = true;
        }

        function spawnLemons(count) { lemonFruits.forEach(f => f.remove()); lemonFruits = []; for (let i = 0; i < count; i++) createLemon(); }
        function createLemon() {
            const lemon = document.createElement('div');
            lemon.className = 'lemon-fruit';
            lemon.textContent = '🍋';
            lemon.style.left = (5 + Math.random() * 90) + '%';
            lemon.style.top = (5 + Math.random() * 90) + '%';
            lemon.style.fontSize = (3 + Math.random() * 2) + 'vmin';
            canopy.appendChild(lemon); lemonFruits.push(lemon);
        }

        function checkLemonCollection() {
            const pRect = playerWrapper.getBoundingClientRect();
            const pCX = pRect.left + pRect.width / 2;
            const pCY = pRect.top + pRect.height / 2;
            for (let i = lemonFruits.length - 1; i >= 0; i--) {
                const l = lemonFruits[i];
                const lRect = l.getBoundingClientRect();
                if (Math.hypot(pCX - (lRect.left + lRect.width/2), pCY - (lRect.top + lRect.height/2)) < 70) {
                    l.remove(); lemonFruits.splice(i, 1);
                    score += 5; updateScore(); playCollect(); createLemon(); break;
                }
            }
        }

        function moveUp() { move(0, -STEP); } function moveDown() { move(0, STEP); }
        function moveLeft() { move(-STEP, 0); } function moveRight() { move(STEP, 0); }

        document.addEventListener('keydown', (e) => {
            if (!e.key.startsWith('Arrow')) return; e.preventDefault();
            switch (e.key) { case 'ArrowUp': moveUp(); break; case 'ArrowDown': moveDown(); break; case 'ArrowLeft': moveLeft(); break; case 'ArrowRight': moveRight(); break; }
        });

        const jButtons = document.querySelectorAll('.joystick button:not(.empty)');
        jButtons.forEach(btn => {
            const dir = btn.dataset.dir;
            const start = (e) => {
                e.preventDefault(); btn.classList.add('active');
                switch (dir) { case 'up': moveUp(); break; case 'down': moveDown(); break; case 'left': moveLeft(); break; case 'right': moveRight(); break; }
                if (moveInterval) clearInterval(moveInterval);
                moveInterval = setInterval(() => {
                    switch (dir) { case 'up': moveUp(); break; case 'down': moveDown(); break; case 'left': moveLeft(); break; case 'right': moveRight(); break; }
                }, 70);
            };
            const stop = (e) => { e.preventDefault(); btn.classList.remove('active'); if (moveInterval) { clearInterval(moveInterval); moveInterval = null; } };
            btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', stop); btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start, { passive: false }); btn.addEventListener('touchend', stop, { passive: false });
        });

        window.addEventListener('resize', () => {
            const maxX = window.innerWidth - 10; const maxY = window.innerHeight - 10;
            if (x > maxX) x = maxX; if (y > maxY) y = maxY; updatePosition(false);
        });

        shopBtn.addEventListener('click', () => { shopModal.classList.add('active'); });
        function closeShop() { shopModal.classList.remove('active'); }
        function buySword() {
            if (score >= 150 && !swordOwned) {
                score -= 150; updateScore(); swordOwned = true;
                localStorage.setItem('swordOwned', 'true');
                buySwordBtn.disabled = true; buySwordBtn.textContent = 'OWNED';
                playBuy(); closeShop();
            }
        }

        adventureBtn.addEventListener('click', () => {
            if (!swordOwned) { alert('You need to buy the Sword of Zest in the shop first!'); return; }
            initAudio();
            adventureOverlay.classList.add('active');
            wormHP = wormMaxHP; updateWormUI();
            battleSwordHolder.classList.add('active'); swordHolder.classList.add('active');
            attackBtn.disabled = false;
        });

        function closeAdventure() { adventureOverlay.classList.remove('active'); battleSwordHolder.classList.remove('active'); }
        function updateWormUI() { let p = (wormHP / wormMaxHP) * 100; wormHPBar.style.width = p + '%'; wormHPText.textContent = 'HP: ' + wormHP + ' / ' + wormMaxHP; }

        function attackWorm() {
            if (isAttacking || wormHP <= 0) return;
            isAttacking = true; attackBtn.disabled = true;
            playSword();
            const bPlayer = document.querySelector('.battle-player .sword-holder');
            bPlayer.style.transform = 'rotate(-30deg) translateX(30px)';
            setTimeout(() => bPlayer.style.transform = 'rotate(-30deg)', 150);
            wormHP -= 5; if (wormHP < 0) wormHP = 0; updateWormUI();
            if (wormHP <= 0) {
                setTimeout(() => { score += 25; updateScore(); playCollect(); wormHP = wormMaxHP; updateWormUI(); isAttacking = false; attackBtn.disabled = false; }, 500);
            } else {
                setTimeout(() => { isAttacking = false; attackBtn.disabled = false; }, 400);
            }
        }

        menu.style.display = 'flex'; game.style.display = 'none';
        window.addEventListener('load', () => { spawnLemons(20); });
    </script>
</body>
</html>
